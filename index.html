<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#063e32"><title>雀灯｜四人打ち麻雀</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#062c25;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.app{max-width:600px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 10px 25px}.head{display:flex;justify-content:space-between;align-items:center;margin:3px 4px 12px}.logo{font-size:11px;letter-spacing:.2em;color:#f0d48b}.logo b{display:block;font-size:25px;color:#fff;letter-spacing:.08em}.btn{border:1px solid #477d68;background:#174c3e;color:#fff;border-radius:10px;padding:10px 12px;font-weight:750;font-size:12px}.felt{border:7px solid #583a28;border-radius:24px;background:radial-gradient(ellipse,#148465,#086148 65%,#064333);padding:10px;box-shadow:0 12px 0 #38261d;}.cpurow{display:grid;grid-template-columns:1fr 1fr;gap:7px}.cpu{background:#063e32bd;border:1px solid #ffffff26;border-radius:10px;padding:7px;min-height:51px}.cpu.active{border-color:#f4d98d;box-shadow:0 0 0 1px #f4d98d55}.label{font-size:10px;color:#d5e8df;display:flex;justify-content:space-between;gap:4px}.backs{display:flex;justify-content:center;gap:2px;margin-top:6px}.back{width:14px;height:21px;border:1px solid #f4dfa1;border-radius:3px;background:repeating-linear-gradient(45deg,#d1b66f 0 2px,#f1dfa7 2px 4px)}.center{margin:9px 0;background:#063d31b8;border:1px solid #ffffff25;border-radius:12px;padding:8px}.round{display:flex;justify-content:space-between;font-size:10px;color:#f2dda0}.turn{text-align:center;font-size:11px;margin:5px;color:#e0eee7}.discards{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;min-height:70px;align-content:center}.tile{height:40px;width:29px;flex-shrink:0;position:relative;border-radius:4px;border:1px solid #d3c5a4;background:linear-gradient(120deg,#fff9e9,#e9dfc5);box-shadow:0 2px 0 #b5a785;color:#1b2922;display:flex;align-items:center;justify-content:center;font-family:"Yu Mincho",serif;font-weight:900;font-size:17px;line-height:1}.tile.red{color:#c52d2d}.tile.blue{color:#285bb1}.tile.green{color:#168257}.tile.honor{font-size:20px}.tile.click{height:47px;width:clamp(22px,6.3vw,35px);font-size:20px;cursor:pointer;transition:transform .08s}.tile.click:active{transform:translateY(-7px)}.tile.draw{margin-left:6px}.myarea{padding:4px 0 0}.mylabel{display:flex;justify-content:space-between;font-size:11px;color:#e3efe8;margin:3px 2px 5px}.hand{display:flex;align-items:flex-end;justify-content:center;gap:2px;min-height:51px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.action{border:1px solid #e5cc84;background:linear-gradient(#fff0c4,#e3c16c);color:#392a15;border-radius:9px;padding:12px 3px;font-size:12px;font-weight:900;box-shadow:0 3px 0 #927039}.action.alt{background:#174c3e;color:#fff;border-color:#477d68;box-shadow:0 3px 0 #03382c}.action:disabled{opacity:.35}.log{background:#062a23;border:1px solid #28604e;border-radius:10px;padding:10px 12px;margin-top:12px;min-height:45px;font-size:11px;line-height:1.7;color:#dcebe2}.log b{color:#f2d68d}.notes{font-size:10px;line-height:1.8;color:#a9c9ba;margin:13px 4px}.veil{display:none;position:fixed;inset:0;background:#001a16cc;z-index:10;align-items:center;justify-content:center;padding:20px}.veil.show{display:flex}.modal{width:100%;max-width:350px;background:#0a4437;border:1px solid #d4b86d;border-radius:20px;padding:22px;text-align:center}.modal h2{color:#f2d68d}.modal p{font-size:13px;line-height:1.8;color:#e0eee7;white-space:pre-line}.modal button{width:100%;margin-top:8px}@media(min-width:500px){.app{padding-top:20px}.tile{width:32px;height:44px}.tile.click{width:35px;height:49px}}
</style></head><body><main class="app"><header class="head"><div class="logo">FOUR PLAYER RIICHI MAHJONG<b>雀灯 <span style="font-size:12px;color:#f0d48b">JANTOU</span></b></div><button class="btn" id="new">↻ 新しい局</button></header>
<section class="felt"><div class="cpurow"><div class="cpu" id="cpu0"><div class="label"><span>西家 · CPU</span><b id="score1">25,000</b></div><div class="backs" id="back0"></div></div><div class="cpu" id="cpu1"><div class="label"><span>北家 · CPU</span><b id="score2">25,000</b></div><div class="backs" id="back1"></div></div></div>
<div class="center"><div class="round"><span id="wind">東一局</span><span id="wall">残り牌 70</span><span id="honba">本場 0</span></div><div class="turn" id="turn">あなたの番：不要な牌を1枚タップ</div><div class="discards" id="river"></div></div>
<div class="cpu" id="cpu2" style="margin-bottom:8px"><div class="label"><span>南家 · CPU</span><b id="score3">25,000</b></div><div class="backs" id="back2"></div></div>
<div class="myarea"><div class="mylabel"><span>東家 · あなた</span><span id="handcount">14枚</span></div><div class="hand" id="hand"></div></div>
<div class="actions"><button class="action" id="win" disabled>和了！</button><button class="action alt" id="riichi" disabled>リーチ</button><button class="action alt" id="sort">牌を整理</button></div>
<div class="actions"><button class="action alt" id="pass" disabled>ロンを見送る</button><button class="action alt" id="hint">ヒント</button><button class="action alt" id="help">遊び方</button></div></section>
<div class="log" id="log" aria-live="polite"><b>対局開始。</b> 14枚の手牌から不要な牌を1枚切ろう。</div>
<div class="notes">スマホで牌をタップして打牌。4面子1雀頭、または七対子を作り、役があると「和了！」が有効になります。テンパイ時はリーチ可能。簡易版のため鳴き・ドラ・細かな点数計算は省略しています。</div></main>
<div class="veil" id="veil"><div class="modal"><div style="font-size:38px">🀄</div><h2 id="mtitle">和了！</h2><p id="mtext"></p><button class="action" id="mok">次の局へ</button></div></div>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id),N=["一","二","三","四","五","六","七","八","九"],S=["萬","筒","索"],Z=["東","南","西","北","白","發","中"];
let wall=[],hand=[],cpu=[[],[],[]],river=[],scores=[25000,25000,25000,25000],turn=0,ended=false,riichi=false,ron=null,round=1,honba=0,lastDraw=false;
const name=t=>t<27?N[t%9]+S[Math.floor(t/9)]:Z[t-27], cls=t=>t>=27?"honor "+(t===31?"red":""):t<9?"red":t<18?"blue":"green";
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newWall(){let a=[];for(let t=0;t<34;t++)for(let k=0;k<4;k++)a.push(t);return shuffle(a)}
function count(a){let c=Array(34).fill(0);a.forEach(t=>c[t]++);return c}
function melds(c){let i=c.findIndex(n=>n);if(i<0)return true;if(c[i]>=3){c[i]-=3;if(melds(c)){c[i]+=3;return true}c[i]+=3}if(i<27&&i%9<7&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;if(melds(c)){c[i]++;c[i+1]++;c[i+2]++;return true}c[i]++;c[i+1]++;c[i+2]++}return false}
function shape(a){if(a.length!==14)return false;if(count(a).filter(n=>n===2).length===7)return true;let c=count(a);for(let i=0;i<34;i++)if(c[i]>=2){c[i]-=2;if(melds(c)){c[i]+=2;return true}c[i]+=2}return false}
function yaku(a){if(!shape(a))return false;let c=count(a);if(c.filter(n=>n===2).length===7)return true;if(a.every(t=>t<27&&t%9>0&&t%9<8))return true;if(a.some(t=>t>=31&&c[t]>=3))return true;let suits=new Set(a.filter(t=>t<27).map(t=>Math.floor(t/9))),honors=a.some(t=>t>=27);if(suits.size===1&&honors)return true;return false}
function tenpai(a){for(let t=0;t<34;t++){if(count(a)[t]<4&&yaku(a.concat(t)))return true}return false}
function tile(t,click=false,i=0,draw=false){return '<div class="tile '+cls(t)+(click?' click':'')+(draw?' draw':'')+'" data-i="'+i+'">'+name(t)+'</div>'}
function log(s){$("log").innerHTML=s}
function render(){
 $("hand").innerHTML=hand.map((t,i)=>tile(t,true,i,lastDraw&&i===hand.length-1)).join("");
 [...$("hand").children].forEach(el=>el.onclick=()=>discard(+el.dataset.i));
 $("river").innerHTML=river.slice(-28).map(x=>tile(x.t)).join("");
 cpu.forEach((h,i)=>{$("back"+i).innerHTML=Array.from({length:Math.min(13,h.length)},()=>'<i class="back"></i>').join("");$("score"+(i+1)).textContent=scores[i+1].toLocaleString();$("cpu"+i).classList.toggle("active",turn===i+1&&!ended)});
 $("score3").textContent=scores[3].toLocaleString();$("cpu2").classList.toggle("active",turn===3&&!ended);
 $("wall").textContent="残り牌 "+wall.length;$("wind").textContent="東"+["一","二","三","四"][(round-1)%4]+"局";$("honba").textContent="本場 "+honba;$("handcount").textContent=hand.length+"枚"+(riichi?" · リーチ":"");
 $("win").disabled=ended||!yaku(hand)||(!lastDraw&&!ron);$("riichi").disabled=ended||riichi||!lastDraw||hand.length!==14||!tenpai(hand.slice(0,-1))||scores[0]<1000;$("pass").disabled=ended||!ron;
}
function start(){wall=newWall();hand=wall.splice(0,14);cpu=[wall.splice(0,13),wall.splice(0,13),wall.splice(0,13)];river=[];turn=0;ended=false;riichi=false;ron=null;lastDraw=true;hand.sort((a,b)=>a-b);$("veil").classList.remove("show");$("turn").textContent="あなたの番：不要な牌を1枚タップ";log("<b>東"+["一","二","三","四"][(round-1)%4]+"局。</b> あなたは東家。手牌を整えてあがりを目指そう。");render()}
function end(title,desc,winner){ended=true;turn=-1;if(winner===0){let pts=2000+hand.filter(t=>t>=31).length*500;scores[0]+=pts;for(let i=1;i<4;i++)scores[i]-=Math.floor(pts/3);desc+=" 獲得 "+pts+"点。"}else if(winner){scores[winner]+=8000;scores[0]-=Math.floor(8000/3)}log("<b>"+title+"</b> "+desc);render();$("mtitle").textContent=title;$("mtext").textContent=desc+"\n\nあなたの持ち点："+scores[0].toLocaleString()+"点";$("mok").textContent="次の局へ";$("veil").classList.add("show")}
function drawPlayer(){if(!wall.length){end("流局","山牌がなくなりました。",null);return}hand.push(wall.pop());lastDraw=true;hand.sort((a,b)=>a-b);turn=0;if(yaku(hand))$("turn").textContent="ツモのチャンス！ 和了ボタンを押そう";else $("turn").textContent="あなたの番：不要な牌を1枚タップ";render()}
function checkDiscard(t,by){if(by===0){for(let i=0;i<3;i++)if(Math.random()<.025&&yaku(cpu[i].concat(t))){end("ロン！",["西家","北家","南家"][i]+"が "+name(t)+" で和了。",i+1);return true}return false}if(yaku(hand.concat(t))){ron={t,by};$("turn").textContent=name(t)+"でロンできます！";log("<b>ロンのチャンス！</b> "+name(t)+"で和了できます。");render();return true}return false}
function discard(i){if(ended||turn!==0||ron)return;let t=hand.splice(i,1)[0];river.push({t,by:0});lastDraw=false;log("あなたは <b>"+name(t)+"</b> を捨てた。");render();if(checkDiscard(t,0))return;cpuTurn(1)}
function cpuTurn(p){if(ended)return;if(!wall.length){end("流局","山牌がなくなりました。",null);return}turn=p;render();$("turn").textContent=["","西家","北家","南家"][p]+"の番…";setTimeout(()=>{if(ended)return;let h=cpu[p-1];h.push(wall.pop());if(yaku(h)&&Math.random()<.18){end("ツモ！",["","西家","北家","南家"][p]+"がツモ和了。",p);return}let c=count(h),idx=0,best=-999;h.forEach((t,i)=>{let v=(c[t]===1?3:c[t]===2?1:0)+(t>=27?Math.random():0);if(v>best){best=v;idx=i}});let t=h.splice(idx,1)[0];river.push({t,by:p});log(["","西家","北家","南家"][p]+"が "+name(t)+" を捨てた。");render();if(checkDiscard(t,p))return;let next=p===3?0:p+1;if(next===0){drawPlayer()}else cpuTurn(next)},450+Math.random()*300)}
$("win").onclick=()=>{if(ended||!yaku(hand))return;let tsumo=lastDraw;ron=null;end(tsumo?"ツモ！":"ロン！",tsumo?"自摸和了！ おめでとう！":"ロン和了！ おめでとう！",0)};
$("riichi").onclick=()=>{if(ended||!lastDraw||!tenpai(hand.slice(0,-1)))return;riichi=true;scores[0]-=1000;log("<b>リーチ！</b> テンパイを宣言。あがりを狙おう。");render()};
$("pass").onclick=()=>{if(!ron)return;let t=ron.t;ron=null;log(name(t)+"のロンを見送りました。");hand.push(t);lastDraw=false;hand.sort((a,b)=>a-b);render();discard(hand.length-1)};
$("sort").onclick=()=>{hand.sort((a,b)=>a-b);render()};
$("hint").onclick=()=>{let t=hand.find(x=>hand.filter(y=>y===x).length===1)||hand[0];log("<b>ヒント：</b> "+name(t)+" のような孤立した牌から切ると、手を整理しやすいよ。")};
$("help").onclick=()=>{ $("mtitle").textContent="遊び方";$("mtext").textContent="牌をタップして1枚切ります。数牌の順子・同じ牌3枚の刻子を4組と、同じ牌2枚の雀頭を作るのが基本。七対子も和了形です。役がある手は「和了！」であがれます。テンパイならリーチを宣言できます。簡易版のため、鳴き・ドラ・厳密な点数計算は省略しています。";$("mok").textContent="対局に戻る";$("veil").classList.add("show")};
$("mok").onclick=()=>{if(ended){round=round%4+1;honba++;start()}else $("veil").classList.remove("show")};$("new").onclick=()=>{round=1;honba=0;scores=[25000,25000,25000,25000];start()};start();
})();</script></body></html>
