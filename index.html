<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07131f"><title>深夜のコンビニ防衛線</title>
<style>
:root{color-scheme:dark;--bg:#07131f;--panel:#102334;--line:#31566a;--cyan:#63efff;--orange:#ff9e65;--text:#eefaff;--muted:#9db8c5;--gold:#ffe18a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#173448,#07131f 70%);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;min-height:100dvh}button{font:inherit;color:var(--text);background:#173448;border:1px solid #42687c;border-radius:12px;padding:12px;touch-action:manipulation}button:active{transform:scale(.97);background:#28536a}.wrap{max-width:980px;margin:auto;padding:12px;display:grid;gap:10px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.logo{font-weight:900;font-size:clamp(18px,4vw,27px);letter-spacing:.02em}.sub{font-size:11px;color:var(--muted)}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{background:#102334;border:1px solid #27475a;border-radius:12px;padding:9px}.stat b{display:block;font-size:18px;color:var(--cyan)}.stat span{font-size:11px;color:var(--muted)}.stage{position:relative;border:1px solid #31566a;border-radius:16px;overflow:hidden;background:#091923;box-shadow:0 14px 45px #0005}canvas{display:block;width:100%;aspect-ratio:5/3;touch-action:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#06131edb;padding:20px;text-align:center}.panel{width:min(430px,100%);padding:20px;border:1px solid #3c6479;border-radius:18px;background:#102638f5;box-shadow:0 12px 40px #0008}.panel h1{font-size:26px;margin:4px 0 10px}.panel p{line-height:1.7;color:#c0d8e3}.panel button{width:100%;font-weight:800;background:linear-gradient(120deg,#137a91,#215a72);margin-top:8px}.hidden{display:none!important}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pad,.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;align-items:center}.pad button{min-height:48px;font-size:20px}.actions{grid-template-columns:repeat(2,1fr)}.actions button{min-height:54px;font-weight:800}.actions .attack{background:#713c30;border-color:#a85e45}.actions .dash{background:#15576b}.foot{color:var(--muted);font-size:11px;text-align:center}.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#102638ed;border:1px solid #63efff;border-radius:20px;padding:8px 14px;white-space:nowrap;font-weight:700;pointer-events:none}.bar{height:7px;background:#213b4a;border-radius:10px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--cyan);width:100%}@media(min-width:720px){.controls{max-width:600px;margin:auto;width:100%}.wrap{padding:18px}.stat{padding:12px}}@media(max-width:440px){.wrap{padding:8px}.hud{gap:5px}.stat{padding:7px}.stat b{font-size:16px}.controls{gap:6px}.pad button{min-height:44px;padding:7px}.actions button{min-height:48px;padding:8px}}
</style></head><body><main class="wrap">
<header class="top"><div><div class="logo">🌙 深夜のコンビニ防衛線</div><div class="sub">MIDNIGHT MART SURVIVAL · オリジナルアーケード</div></div><button id="sound" aria-label="効果音切替">🔊 音 ON</button></header>
<section class="hud"><div class="stat"><span>生存時間</span><b id="time">00:00</b></div><div class="stat"><span>スコア</span><b id="score">0</b></div><div class="stat"><span>コンボ</span><b id="combo">×1</b></div><div class="stat"><span>体力</span><b id="hp">100</b><div class="bar"><i id="hpbar"></i></div></div></section>
<div class="stage"><canvas id="game" width="900" height="540"></canvas><div id="toast" class="toast hidden"></div><div id="overlay" class="overlay"><div class="panel"><div style="font-size:42px">🏪 🌃</div><h1 id="title">閉店まで、生き残れ。</h1><p id="desc">深夜の店に押し寄せる迷惑客（？）から商品棚を守れ！<br>移動して、押し返して、コインを集めて強化。<br>60秒ごとにラッシュが激しくなる。</p><button id="start">勤務開始</button><div class="sub" style="margin-top:10px">スマホ：画面下の操作パッド ／ PC：WASD・矢印キー、Spaceで攻撃、Shiftでダッシュ</div></div></div></div>
<section class="controls"><div class="pad"><span></span><button data-move="0,-1">▲</button><span></span><button data-move="-1,0">◀</button><button data-move="0,0">●</button><button data-move="1,0">▶</button><span></span><button data-move="0,1">▼</button><span></span></div><div class="actions"><button class="attack" id="attack">🧹 モップ攻撃</button><button class="dash" id="dash">💨 ダッシュ</button><button id="heal">🥤 回復（3🪙）</button><button id="upgrade">🧤 強化（5🪙）</button></div></section>
<div class="top"><div><b>🪙 <span id="coins">0</span></b> <span class="sub">コイン</span></div><div class="sub" id="wave">ラッシュまで 60秒</div><button id="pause">一時停止</button></div>
<div class="foot">敵は自動追跡。攻撃は周囲に当たり判定あり。ハイスコアと強化はこの端末に保存されます。</div></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
const W=900,H=540;let state='menu',last=0,raf=0,elapsed=0,score=0,coins=0,kills=0,combo=1,comboTimer=0,spawnTimer=0,attackCd=0,dashCd=0,invuln=0,upgrade=0,sound=true,high=+(localStorage.getItem('midnightHigh')||0),enemies=[],particles=[],keys={},move={x:0,y:0},held=new Set(),player;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function reset(){elapsed=0;score=0;coins=0;kills=0;combo=1;comboTimer=0;spawnTimer=.5;attackCd=0;dashCd=0;invuln=0;upgrade=0;enemies=[];particles=[];player={x:W/2,y:H/2,r:17,hp:100,maxHp:100,speed:210,damage:1,dash:0,dirX:1,dirY:0};move={x:0,y:0};}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.add('hidden'),1100)}
function start(){reset();state='playing';$('overlay').classList.add('hidden');last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function end(){state='over';high=Math.max(high,score);localStorage.setItem('midnightHigh',high);$('title').textContent='本日の勤務、終了。';$('desc').innerHTML='スコア <b>'+score+'</b> ／撃退 '+kills+'人<br>ハイスコア：'+high+'<br>もう一度シフトに入りますか？';$('start').textContent='もう一度プレイ';$('overlay').classList.remove('hidden')}
function spawn(){let side=Math.floor(Math.random()*4),x=side===0?-22:side===1?W+22:rand(0,W),y=side===2?-22:side===3?H+22:rand(0,H);let tier=Math.random()<Math.min(.12,elapsed/500)?2:1;enemies.push({x,y,r:tier===2?21:15,hp:tier===2?3:1,maxHp:tier===2?3:1,speed:rand(48,73)+Math.min(65,elapsed*.35),dmg:tier===2?18:10,kind:tier,hit:0,angle:0});}
function burst(x,y,color,n=8){for(let i=0;i<n;i++){let a=rand(0,Math.PI*2),v=rand(45,180);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.2,.55),max:.55,color,r:rand(2,5)})}}
function attack(){if(state!=='playing'||attackCd>0)return;attackCd=.38;let hit=0;for(let e of enemies){let dx=e.x-player.x,dy=e.y-player.y,d=Math.hypot(dx,dy);if(d<77+e.r){let nx=d?dx/d:1,ny=d?dy/d:0;e.hp-=player.damage;e.x+=nx*30;e.y+=ny*30;e.hit=.14;burst(e.x,e.y,'#ffe18a',4);hit++;if(e.hp<=0){score+=10*combo;coins+=1;kills++;combo=Math.min(9,combo+1);comboTimer=2.4;burst(e.x,e.y,e.kind===2?'#ff8a65':'#63efff',12)}}}enemies=enemies.filter(e=>e.hp>0);if(hit===0){combo=1;comboTimer=0}else{score+=hit*2;if(sound)beep(240,.035)}}
function dash(){if(state!=='playing'||dashCd>0)return;dashCd=1.5;player.dash=.19;invuln=.24;player.speed=420;burst(player.x,player.y,'#63efff',5)}
function beep(freq,dur){try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;g.gain.value=.025;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.stop(a.currentTime+dur);o.onended=()=>a.close()}catch{}}
function update(dt){elapsed+=dt;attackCd=Math.max(0,attackCd-dt);dashCd=Math.max(0,dashCd-dt);invuln=Math.max(0,invuln-dt);if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0)combo=1}
let x=move.x,y=move.y;if(keys.w||keys.arrowup)y-=1;if(keys.s||keys.arrowdown)y+=1;if(keys.a||keys.arrowleft)x-=1;if(keys.d||keys.arrowright)x+=1;let l=Math.hypot(x,y);if(l>1){x/=l;y/=l}if(l){player.dirX=x;player.dirY=y}
player.x=clamp(player.x+x*player.speed*dt,24,W-24);player.y=clamp(player.y+y*player.speed*dt,24,H-24);if(player.dash>0){player.dash-=dt;if(player.dash<=0)player.speed=210+upgrade*8}
spawnTimer-=dt;if(spawnTimer<=0){spawn();spawnTimer=Math.max(.22,1.05-elapsed*.009)*(elapsed%60>48?.55:1)}
for(let e of enemies){let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt;e.hit=Math.max(0,e.hit-dt);if(d<e.r+player.r&&invuln<=0){player.hp-=e.dmg*dt;player.x=clamp(player.x+dx/d*18*dt,24,W-24);player.y=clamp(player.y+dy/d*18*dt,24,H-24);if(player.hp<=0){player.hp=0;end();return}}}
for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;p.life-=dt}particles=particles.filter(p=>p.life>0);
if(Math.floor(elapsed/60)>Math.floor((elapsed-dt)/60))toast('🚨 ラッシュ到来！敵が増えた！');
$('time').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(Math.floor(elapsed%60)).padStart(2,'0');$('score').textContent=score;$('combo').textContent='×'+combo;$('hp').textContent=Math.ceil(player.hp);$('hpbar').style.width=(player.hp/player.maxHp*100)+'%';$('coins').textContent=coins;$('wave').textContent='ラッシュまで '+Math.max(0,60-Math.floor(elapsed%60))+'秒 · 撃退 '+kills;
}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#0a1b24';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#183643';ctx.lineWidth=1;for(let x=0;x<W;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
ctx.fillStyle='#162f3a';ctx.fillRect(330,70,240,115);ctx.fillStyle='#224957';ctx.fillRect(345,85,210,80);ctx.fillStyle='#63efff';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText('MIDNIGHT MART',450,118);ctx.font='12px sans-serif';ctx.fillStyle='#b9dce7';ctx.fillText('OPEN 24 HOURS',450,142);
ctx.fillStyle='#253a36';ctx.fillRect(40,210,105,22);ctx.fillRect(755,210,105,22);ctx.fillStyle='#5b8c6e';ctx.fillRect(45,214,95,14);ctx.fillRect(760,214,95,14);
for(let e of enemies){ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle=e.hit>0?'#fff':e.kind===2?'#ff805f':'#f5bd70';ctx.shadowBlur=e.kind===2?16:5;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#17202a';ctx.beginPath();ctx.arc(-5,-3,2.5,0,Math.PI*2);ctx.arc(5,-3,2.5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#17202a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,3,5,0,Math.PI);ctx.stroke();if(e.maxHp>1){ctx.fillStyle='#3b1e20';ctx.fillRect(-18,-e.r-9,36,4);ctx.fillStyle='#ff6f61';ctx.fillRect(-18,-e.r-9,36*e.hp/e.maxHp,4)}ctx.restore()}
for(let p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
if(player){ctx.save();ctx.translate(player.x,player.y);ctx.fillStyle=invuln>0?'#fff':'#63efff';ctx.shadowBlur=invuln>0?24:14;ctx.shadowColor='#63efff';ctx.beginPath();ctx.arc(0,0,player.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#09202c';ctx.beginPath();ctx.arc(-5,-3,3,0,Math.PI*2);ctx.arc(5,-3,3,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffe18a';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(player.dirX*13,player.dirY*13);ctx.lineTo(player.dirX*29,player.dirY*29);ctx.stroke();ctx.restore()}
ctx.textAlign='left';ctx.font='bold 13px sans-serif';ctx.fillStyle='#9bb9c6';ctx.fillText('HIGH SCORE '+Math.max(high,score),18,25);ctx.textAlign='right';ctx.fillStyle='#ffe18a';ctx.fillText('SHIFT '+(Math.floor(elapsed/60)+1),W-18,25);
}
function loop(now){if(state!=='playing')return;let dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt);draw();if(state==='playing')raf=requestAnimationFrame(loop)}
$('start').addEventListener('click',start);$('attack').addEventListener('pointerdown',e=>{e.preventDefault();attack()});$('dash').addEventListener('pointerdown',e=>{e.preventDefault();dash()});$('heal').addEventListener('click',()=>{if(state!=='playing')return;if(coins<3){toast('コインが足りない！');return}if(player.hp>=player.maxHp){toast('体力は満タン！');return}coins-=3;player.hp=Math.min(player.maxHp,player.hp+35);toast('🥤 体力回復！')});$('upgrade').addEventListener('click',()=>{if(state!=='playing')return;if(coins<5){toast('コインが足りない！');return}if(upgrade>=8){toast('強化は最大！');return}coins-=5;upgrade++;player.damage++;player.speed=210+upgrade*8;toast('🧤 モップ強化 Lv.'+upgrade)});
$('pause').addEventListener('click',()=>{if(state==='playing'){state='paused';$('title').textContent='休憩中';$('desc').textContent='一息ついて、また売り場を守ろう。';$('start').textContent='勤務再開';$('overlay').classList.remove('hidden');$('start').onclick=resume;cancelAnimationFrame(raf)}else if(state==='paused')resume()});function resume(){state='playing';$('overlay').classList.add('hidden');$('start').onclick=start;last=performance.now();raf=requestAnimationFrame(loop)}
$('sound').addEventListener('click',()=>{sound=!sound;$('sound').textContent=sound?'🔊 音 ON':'🔇 音 OFF'});
document.querySelectorAll('[data-move]').forEach(b=>{let vec=b.dataset.move.split(',').map(Number);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);held.add(b);move.x=vec[0];move.y=vec[1]});const off=()=>{held.delete(b);if(!held.size)move={x:0,y:0}};['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,off))});
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(e.repeat)return;if(k===' ')attack();if(k==='shift')dash()});window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing'){$('pause').click()}});
reset();draw();
})();
</script></body></html>
