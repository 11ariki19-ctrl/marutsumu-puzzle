<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),cv=$('ground'),cx=cv.getContext('2d'),content=$('content');
const FAC={
field:{name:'練習グラウンド',cost:900000,kind:'train',desc:'練習効果が上がり、選手の疲労回復も少し早くなる',color:'#5ca85d',icon:'⚽',training:2},

};

let seed=71;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}function rand(n){return Math.floor(rnd()*n)}
function makePlayer(i,base=48){let p=pos[i%pos.length];return{id:'pl'+Date.now().toString(36)+i+rand(999),name:surnames[rand(surnames.length)]+firsts[rand(firsts.length)],pos:p,age:18+rand(13),ov:Math.max(25,base+rand(15)-7),potential:rand(5)+1,level:1,exp:0,stamina:75+rand(26),morale:60+rand(36),value:Math.max(180000,base*26000+rand(220000)),wage:Math.max(25000,base*1250+rand(17000)),goals:0,assists:0,apps:0,skill:rand(5),injury:0}}
function fresh(){let ps=Array.from({length:16},(_,i)=>makePlayer(i,47));return{club:'みどりFC',money:12000000,fans:1200,season:1,week:1,points:0,w:0,d:0,l:0,gf:0,ga:0,players:ps,formation:'4-4-2',tactic:'balanced',facilities:[],tiles:Array.from({length:35},(_,i)=>({id:i,building:i===17?'stadium':i===16?'field':null,level:1})),sponsorLevel:1,sponsorIncome:180000,table:[],lastMatch:null,events:['クラブが設立された！まずは施設と選手を育てよう。'],history:[],scout:null,sponsorDeal:null,unlocks:['regional'],titles:[],matchLogs:[],matchReady:true}}
let s;try{let v=JSON.parse(localStorage.getItem('footballdays-save-v2'));s=v&&Array.isArray(v.players)&&v.players.length?v:fresh()}catch(e){s=fresh()}
if(!s.tiles||s.tiles.length!==35)s.tiles=Array.from({length:35},(_,i)=>({id:i,building:i===17?'stadium':i===16?'field':null,level:1}));
if(!s.facilities)s.facilities=[];if(!s.events)s.events=[];if(!s.table)s.table=[];if(!s.unlocks)s.unlocks=['regional'];if(!s.week)s.week=1;
const opponentsBase=['港町ユナイテッド','山の手SC','東都ブルーズ','さくらスポーツ','北風クラブ','リバーサイド','サンライズFC'];
let tab='home',selectedTile=0,toastTimer,liveMatch=null;
function money(n){return '¥'+Math.floor(n).toLocaleString('ja-JP')}function note(t){s.events.unshift(t);s.events=s.events.slice(0,9)}function save(){try{localStorage.setItem('footballdays-save-v2',JSON.stringify(s))}catch(e){}}
function power(){let a=s.players.slice().sort((x,y)=>y.ov-y.ov).slice(0,11);return Math.round(a.reduce((z,p)=>z+p.ov,0)/Math.max(1,a.length)+s.facilities.length*.7)}function facilityCount(k){return s.tiles.filter(t=>t.building===k).length}function facilityLevel(k){return s.tiles.filter(t=>t.building===k).reduce((a,t)=>a+t.level,0)}function popular(){return Math.min(5,1+Math.floor(s.fans/3500)+Math.floor(s.titles.length/2))}

function drawGround(){let r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));cx.setTransform(d,0,0,d,0,0);let w=r.width,h=r.height;cx.fillStyle='#8cba69';cx.fillRect(0,0,w,h);let tw=Math.min(w/8.7,h/5.5),th=tw*.49,ox=w/2,oy=h*.13;
function iso(x,y){return{x:ox+(x-y)*tw*.5,y:oy+(x+y)*th*.5}}
let drawOrder=[];for(let y=0;y<5;y++)for(let x=0;x<7;x++)drawOrder.push({x,y});drawOrder.sort((a,b)=>a.x+a.y-b.x-b.y);
for(let q of drawOrder){let {x,y}=q,p=iso(x,y),tile=s.tiles[y*7+x];cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x+tw/2,p.y+th/2);cx.lineTo(p.x,p.y+th);cx.lineTo(p.x-tw/2,p.y+th/2);cx.closePath();cx.fillStyle=(x+y)%2?'#9bc779':'#8fbd6b';cx.fill();cx.strokeStyle='#719e58';cx.lineWidth=1;cx.stroke();
if(tile.building){let key=tile.building,fac=FAC[key]||FAC.field;let bw=tw*.48,bh=th*1.25,baseY=p.y+th*.42;cx.fillStyle='#65804b';cx.fillRect(p.x-bw/2+3,baseY+bh*.35,bw,bh*.45);cx.fillStyle=fac.color;cx.fillRect(p.x-bw/2,baseY-bh*.35,bw,bh*.7);cx.fillStyle='#e8d5a1';cx.beginPath();cx.moveTo(p.x-bw/2-2,baseY-bh*.35);cx.lineTo(p.x,baseY-bh*.65);cx.lineTo(p.x+bw/2+2,baseY-bh*.35);cx.closePath();cx.fill();cx.fillStyle='#28432c';cx.fillRect(p.x-bw*.28,baseY-bh*.13,bw*.18,bh*.22);cx.fillRect(p.x+bw*.1,baseY-bh*.13,bw*.18,bh*.22);cx.fillStyle='#fff4ce';cx.font='bold '+Math.max(9,tw*.21)+'px sans-serif';cx.textAlign='center';cx.fillText(fac.icon,p.x,baseY-bh*.72);if(tile.level>1){cx.fillStyle='#183722';cx.font='bold 8px sans-serif';cx.fillText('Lv'+tile.level,p.x,baseY+bh*.56)}}
else{cx.fillStyle='#e1df8c';cx.fillRect(p.x-2,p.y+th*.4,4,3);if(selectedTile===tile.id){cx.strokeStyle='#ffe778';cx.lineWidth=2;cx.beginPath();cx.moveTo(p.x,p.y-2);cx.lineTo(p.x+tw/2+2,p.y+th/2);cx.lineTo(p.x,p.y+th+2);cx.lineTo(p.x-tw/2-2,p.y+th/2);cx.closePath();cx.stroke()}}
}
cx.fillStyle='#244c31';cx.font='bold 10px sans-serif';cx.textAlign='left';cx.fillText('MIDORI CLUB TOWN',8,15)}
function header(){ $('money').textContent=money(s.money);$('fans').textContent=Math.floor(s.fans).toLocaleString('ja-JP');$('power').textContent=power();$('popularity').textContent='★'+popular();$('seasonlabel').textContent=s.season+'年目 · 第'+s.week+'週';$('clubname').textContent='選手育成モード';$('clubsub').textContent='選手獲得・育成・試合アクション';$('rank').textContent='登録 '+s.players.length+'名';drawGround()}
function card(title,value,desc,action,label){return '<div class="panel"><h3>'+title+'</h3><div style="font-size:21px;color:var(--gold);font-weight:1000">'+value+'</div><div class="muted" style="margin:5px 0 9px">'+desc+'</div>'+(action?'<button class="btn full '+(action==='match'||action==='train'?'gold':'')+'" data-action="'+action+'">'+label+'</button>':'')+'</div>'}

function home(){const top=s.players.slice().sort((a,b)=>b.ov-a.ov).slice(0,3);content.innerHTML='<div class="secttitle">選手育成ホーム <span class="muted">シーズン '+s.season+' · 第'+s.week+'週</span></div><div class="grid2"><div class="metric"><label>チーム総合力</label><b>'+power()+'</b><small>登録選手 '+s.players.length+'名</small></div><div class="metric"><label>今季成績</label><b>'+s.w+'勝 '+s.d+'分 '+s.l+'敗</b><small>得点 '+s.gf+' · 失点 '+s.ga+'</small></div></div><div class="secttitle">チームの主力</div><div class="panel">'+top.map((p,i)=>'<div class="player" data-player="'+p.id+'"><div class="jersey">'+(i+1)+'</div><div><b>'+p.name+'</b><small style="display:block;color:var(--muted)">'+p.pos+' · '+p.age+'歳 · OVR '+p.ov+'</small></div><div class="ov">'+p.ov+'</div></div>').join('')+'</div><div class="grid2"><button class="btn gold full" data-action="scout">＋ 選手を獲得</button><button class="btn full" data-tab="match">試合を始める</button><button class="btn full" data-tab="train">選手を育成</button><button class="btn full" data-tab="team">選手一覧を見る</button></div><div class="secttitle">最近の試合・選手ニュース</div><div class="panel">'+(s.events.slice(0,5).map(t=>'<div class="event">'+t+'</div>').join('')||'<div class="muted">試合を始めて選手たちの記録を作ろう。</div>')+'</div>'}
function team(){let ps=s.players.slice().sort((a,b)=>b.ov-a.ov);content.innerHTML='<div class="secttitle">選手名鑑 <span class="muted">'+ps.length+'名</span></div><button class="btn gold full" data-action="scout" style="margin-bottom:10px">＋ 新しい選手を獲得</button><div class="panel"><h3>チーム戦術</h3><div class="muted">フォーメーションでチームの特徴が変化。試合前にコンディションも確認しよう。</div><div class="grid3" style="margin-top:8px">'+formations.map(f=>'<button class="btn small '+(s.formation===f?'gold':'')+'" data-formation="'+f+'">'+f+'</button>').join('')+'</div><div class="row"><span>チーム戦術</span><select id="tactic" style="background:#203728;color:#fff7dc;border:1px solid #657c53;border-radius:4px;padding:7px"><option value="balanced" '+(s.tactic==='balanced'?'selected':'')+'>バランス</option><option value="attack" '+(s.tactic==='attack'?'selected':'')+'>攻撃重視</option><option value="defense" '+(s.tactic==='defense'?'selected':'')+'>守備重視</option><option value="counter" '+(s.tactic==='counter'?'selected':'')+'>カウンター</option></select></div></div>'+ps.map(p=>'<div class="player" data-player="'+p.id+'"><div class="jersey">'+p.pos+'</div><div><b>'+p.name+'</b><small style="display:block;color:var(--muted);font-size:10px">'+p.age+'歳 · Lv.'+p.level+' · '+(p.stamina<50?'疲労':p.morale>80?'好調':'普通')+' · 年俸 '+money(p.wage)+'</small><div class="bar"><i style="width:'+p.stamina+'%"></i></div></div><div class="ov">'+p.ov+'<div style="font-size:9px;color:var(--muted);text-align:right">OVR</div></div></div>').join('')}
function training(){content.innerHTML='<div class="secttitle">特訓・育成 <span class="muted">施設ボーナス適用</span></div><div class="panel"><h3>練習コースを選ぶ</h3><div class="muted">特訓には費用がかかります。若手は成長しやすいですが、練習を重ねると疲労がたまります。</div></div><div class="grid2">'+[['all','総合練習','全能力を少しずつ伸ばす','全体'],['shoot','シュート特訓','FW/MFの攻撃力・得点力','攻撃'],['defend','守備特訓','GK/DFの守備と安定感','守備'],['fitness','体力づくり','疲労を回復しフィジカル強化','回復']].map(a=>'<div class="panel"><h3>'+a[1]+'</h3><div class="muted">'+a[2]+'</div><button class="btn full" style="margin-top:9px" data-train="'+a[0]+'">'+a[3]+'コースを実施</button></div>').join('')+'</div><div class="panel"><h3>育成のコツ</h3><div class="muted">練習場・ジム・アカデミーを建てると育成効率が上昇。温泉を建てると試合後の回復が強化されます。</div></div>'}
function matchTab(){let rounds=Array.from({length:12},(_,i)=>'<div class="row"><span>第'+(i+1)+'節 <small>'+(i<s.week-1?(s.matchLogs[i]||'試合終了'):i===s.week-1?'次の試合':'日程未到来')+'</small></span><span class="pill">'+(i<s.week-1?'終了':i===s.week-1?'NEXT':'予定')+'</span></div>').join('');let arr=[{name:s.club,pts:s.points,w:s.w,d:s.d,l:s.l,gf:s.gf,ga:s.ga,self:true},...s.table].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga));content.innerHTML='<div class="secttitle">大会・リーグ戦</div><div class="panel"><h3>地域リーグ 第'+Math.min(12,s.week)+'節</h3><div class="muted">試合は自動進行。チーム力、疲労、戦術、ホーム施設の効果を反映し、試合中のイベントと得点経過を表示します。</div><div class="grid2" style="margin-top:10px"><div class="metric"><label>チーム力</label><b>'+power()+'</b><small>戦術 '+({'balanced':'バランス','attack':'攻撃重視','defense':'守備重視','counter':'カウンター'}[s.tactic])+'</small></div><div class="metric"><label>今季勝ち点</label><b>'+s.points+'</b><small>'+s.w+'勝 '+s.d+'分 '+s.l+'敗</small></div></div><button class="btn gold full" style="margin-top:10px" data-action="match">'+(s.week>12?'シーズンを締めくくる':'⚽ 試合開始')+'</button></div><div class="secttitle">リーグ順位表</div><div class="panel"><div class="row"><b>クラブ</b><b>勝点 / 得失点</b></div>'+arr.map((t,i)=>'<div class="row" style="background:'+(t.self?'#35563b':'transparent')+'"><span><b>'+(i+1)+'. '+t.name+'</b><small>'+(t.w||0)+'勝 '+(t.d||0)+'分 '+(t.l||0)+'敗</small></span><span><b>'+t.pts+' pt</b><small>'+((t.gf||0)-(t.ga||0))+'</small></span></div>').join('')+'</div><div class="secttitle">今季の試合記録</div><div class="panel">'+(s.matchLogs.slice().reverse().map(x=>'<div class="event">'+x+'</div>').join('')||'<div class="muted">試合を開始すると結果が記録されます。</div>')+'</div>'}
function office(){content.innerHTML='<div class="secttitle">クラブ運営メニュー</div><div class="grid2">'+card('施設開発','空き地 '+s.tiles.filter(t=>!t.building).length,'敷地に練習施設・ショップ・温泉などを建設','build','建設メニュー')+card('選手スカウト','候補を探す','移籍金と交渉で新戦力を獲得','scout','スカウト市場')+card('スポンサー契約','Lv.'+s.sponsorLevel,'交渉で毎週の収入を増やす','sponsor','契約交渉')+card('クラブ名変更',s.club,'自分のクラブに好きな名前を付けよう','rename','クラブ名を変更')+'</div><div class="secttitle">施設一覧</div><div class="grid2">'+Object.keys(FAC).map(k=>'<div class="panel"><h3>'+FAC[k].icon+' '+FAC[k].name+'</h3><div class="muted">'+FAC[k].desc+'</div><div class="row"><span>建設数</span><b>'+facilityCount(k)+'</b></div></div>').join('')+'</div><div class="panel"><h3>セーブデータ</h3><div class="muted">ゲームの進行状況はこのブラウザに自動保存されます。ブラウザのデータを削除するとセーブも消える場合があります。</div><div class="btnrow" style="margin-top:9px"><button class="btn small" data-action="save">手動保存</button><button class="btn small red" data-action="reset">最初からやり直す</button></div></div>'+eventFeed()}
function render(){header();if(tab==='home')home();if(tab==='team')team();if(tab==='train')training();if(tab==='match')matchTab();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));save()}
function modal(title,html){$('modaltitle').textContent=title;$('modalbody').innerHTML=html;$('modalback').classList.add('show')}
function close(){if(liveMatch){renderLiveMatch();notify('試合中はこの画面を閉じられません。試合を進行してください。');return}$('modalback').classList.remove('show');render()}
function buildMenu(){let empty=s.tiles.filter(t=>!t.building);if(!empty.length)return notify('空き地がありません');let tile=s.tiles.find(t=>t.id===selectedTile&&!t.building)||empty[0];selectedTile=tile.id;modal('施設を建設','<div class="muted">空き地を選んで施設を建設。施設は毎週の収入、育成、回復、ファン獲得などに影響します。</div><div class="grid2" style="margin-top:10px">'+Object.keys(FAC).map(k=>'<div class="panel"><h3>'+FAC[k].icon+' '+FAC[k].name+'</h3><div class="muted">'+FAC[k].desc+'</div><div style="color:var(--gold);font-weight:900;margin:7px 0">'+money(FAC[k].cost)+'</div><button class="btn full" data-build="'+k+'" '+(s.money<FAC[k].cost?'disabled':'')+'>建設する</button></div>').join('')+'</div><div class="muted">選択区画：'+(tile.id+1)+'番地</div>')}
function negotiateScout(){let candidates=Array.from({length:3},(_,i)=>({...makePlayer(50+i,48+Math.floor(rnd()*19)),potential:2+rand(5),value:Math.max(250000,400000+rand(1000000))}));s.scout={candidates,selected:null,trust:0,round:0};modal('選手スカウト','<div class="muted">3人の候補から選び、3回の交渉で加入を目指します。クラブ人気とアカデミーが高いほど交渉に有利です。</div>'+candidates.map(p=>'<div class="player"><div class="jersey">'+p.pos+'</div><div><b>'+p.name+'</b><small>'+p.age+'歳 · 総合 '+p.ov+' · 成長 '+('★'.repeat(p.potential))+' · 移籍金 '+money(p.value)+'</small></div><button class="btn small" data-candidate="'+p.id+'">交渉</button></div>').join(''))}
function startNegotiation(id){let p=s.scout.candidates.find(x=>x.id===id);if(!p)return;s.scout.selected=id;s.scout.trust=15+popular()*5+facilityLevel('academy')*3;s.scout.round=0;scoutNegotiationView()}
function scoutNegotiationView(){let n=s.scout,p=n.candidates.find(x=>x.id===n.selected);modal('契約交渉：'+p.name,'<div class="panel"><h3>選手の加入意欲</h3><div style="font-size:28px;color:var(--gold);font-weight:1000">'+Math.min(100,n.trust)+'%</div><div class="bar"><i style="width:'+Math.min(100,n.trust)+'%"></i></div><div class="muted">交渉 '+n.round+'/3回 · 移籍金 '+money(p.value)+'</div></div><div class="grid2"><button class="btn" data-talk="salary">年俸を好条件にする</button><button class="btn" data-talk="project">将来のビジョンを語る</button><button class="btn" data-talk="role">出場機会を約束</button><button class="btn" data-talk="bonus">契約ボーナスを提示</button></div><div class="muted" style="margin-top:8px">交渉方法によって成功率が変わります。3回以内に意欲100%で獲得できます。</div>')}
function talk(kind){let n=s.scout,p=n.candidates.find(x=>x.id===n.selected);if(!p)return;let gain=kind==='salary'?18+rand(18):kind==='project'?14+rand(23):kind==='role'?(p.ov>power()/1.8?18:12)+rand(12):25+rand(20);if(kind==='bonus'&&s.money<180000)return notify('ボーナス提示には¥180,000必要です');if(kind==='bonus')s.money-=180000;n.trust=Math.min(100,n.trust+gain);n.round++;if(n.trust>=100){if(s.money<p.value){notify('移籍金が足りません。資金を貯めて再交渉しよう');n.trust=75;scoutNegotiationView();return}modal('契約成立！','<div class="panel"><h3>'+p.name+'が加入！</h3><div class="muted">移籍金 '+money(p.value)+'を支払い、新たな戦力がチームに加わりました。</div></div><button class="btn gold full" id="signNow">選手と契約する</button>');$('signNow').onclick=()=>{s.money-=p.value;s.players.push(p);note(p.name+'がクラブに加入した！');s.scout=null;close();notify('新戦力が加入しました！')};return}if(n.round>=3){modal('交渉終了','<div class="panel"><h3>今回は見送り</h3><div class="muted">'+p.name+'はまだ加入を決断しませんでした。クラブ人気や施設を上げて再挑戦しましょう。</div></div><button class="btn full" id="backScout">スカウト市場へ戻る</button>');$('backScout').onclick=negotiateScout;return}scoutNegotiationView();notify('加入意欲が'+gain+'%上昇！')}
function sponsor(){s.sponsorDeal={trust:20+popular()*8,round:0};sponsorView()}
function sponsorView(){let d=s.sponsorDeal;modal('スポンサー交渉','<div class="panel"><h3>スポンサーの契約意欲</h3><div style="font-size:27px;color:var(--gold);font-weight:1000">'+Math.min(100,d.trust)+'%</div><div class="bar"><i style="width:'+Math.min(100,d.trust)+'%"></i></div><div class="muted">交渉 '+d.round+'/3回 · 現在の週収入 '+money(s.sponsorIncome)+'</div></div><div class="grid2"><button class="btn" data-sponsor-talk="fans">ファンの多さをアピール</button><button class="btn" data-sponsor-talk="facility">施設の充実をアピール</button><button class="btn" data-sponsor-talk="results">試合成績をアピール</button><button class="btn" data-sponsor-talk="offer">広告枠を追加で提示</button></div>')}
function sponsorTalk(k){let d=s.sponsorDeal;let g=k==='fans'?12+Math.floor(s.fans/800)+rand(14):k==='facility'?12+facilityCount('stadium')*5+rand(14):k==='results'?12+s.w*2+rand(16):25+rand(20);d.trust=Math.min(100,d.trust+g);d.round++;if(d.trust>=100){let add=70000+popular()*30000+facilityCount('office')*40000;s.sponsorLevel++;s.sponsorIncome+=add;note('スポンサー契約を獲得！毎週の収入が'+money(add)+'増加');modal('スポンサー契約成立！','<div class="panel"><h3>新たな契約を獲得</h3><div style="font-size:24px;color:var(--gold);font-weight:1000">+'+money(add)+'/週</div><div class="muted">クラブの知名度が上がり、運営資金に余裕が生まれました。</div></div><button class="btn gold full" id="sponsorDone">続ける</button>');$('sponsorDone').onclick=()=>{s.sponsorDeal=null;close()};return}if(d.round>=3){modal('交渉終了','<div class="muted">契約条件がまとまりませんでした。ファンやクラブ施設を増やして再挑戦しましょう。</div><button class="btn full" id="sponsorBack">戻る</button>');$('sponsorBack').onclick=()=>{s.sponsorDeal=null;close()};return}sponsorView()}
function trainCourse(k){if(s.money<120000)return notify('特訓費用が足りません');s.money-=120000;let trainingBonus=1+facilityLevel('field')*.08+facilityLevel('gym')*.1+facilityLevel('academy')*.06;let total=0;s.players.forEach(p=>{let young=p.age<23?1.7:p.age<28?1:.55;let gain=k==='fitness'?0:Math.random()*.9*young*trainingBonus*(.7+p.potential*.12);if(k==='shoot'&&['FW','MF'].includes(p.pos))gain*=1.65;if(k==='shoot'&&!['FW','MF'].includes(p.pos))gain*=.5;if(k==='defend'&&['GK','DF'].includes(p.pos))gain*=1.65;if(k==='defend'&&!['GK','DF'].includes(p.pos))gain*=.5;if(k==='fitness'){p.stamina=Math.min(100,p.stamina+23);p.ov+=Math.random()<.22?1:0}else{p.ov=Math.min(99,p.ov+(gain>.8?1:0));p.exp+=Math.round(gain*10);p.stamina=Math.max(35,p.stamina-5);p.level=1+Math.floor(p.exp/40)}p.morale=Math.min(100,p.morale+4);total+=gain});note(({all:'全体練習',shoot:'シュート特訓',defend:'守備特訓',fitness:'体力づくり'})[k]+'を実施した。');render();notify('特訓完了！育成効果 '+total.toFixed(1))}
function build(k){let t=s.tiles.find(x=>x.id===selectedTile);if(!t||t.building)return notify('空き地を選択してください');let f=FAC[k];if(!f)return;if(s.money<f.cost)return notify('建設資金が足りません');s.money-=f.cost;t.building=k;t.level=1;note(f.name+'を建設！クラブタウンが発展した');close();notify(f.name+'を建設しました')}
function tileModal(id){selectedTile=id;let t=s.tiles[id];if(!t)return;if(t.building){let f=FAC[t.building],cost=Math.floor(f.cost*(.7+t.level*.45));modal(f.name,'<div class="panel"><h3>'+f.icon+' '+f.name+' Lv.'+t.level+'</h3><div class="muted">'+f.desc+'</div><div class="row"><span>次の強化費用</span><b style="color:var(--gold)">'+money(cost)+'</b></div><button class="btn gold full" data-upgrade="'+id+'">施設を強化</button><button class="btn full" style="margin-top:7px" id="tileBack">閉じる</button></div>');$('tileBack').onclick=close}else buildMenu()}
function upgradeTile(id){let t=s.tiles[id],f=FAC[t.building],cost=Math.floor(f.cost*(.7+t.level*.45));if(s.money<cost)return notify('資金が足りません');s.money-=cost;t.level++;note(f.name+'をLv.'+t.level+'に強化した');close();notify('施設レベルが上がりました')}
function weekAdvance(){let income=s.sponsorIncome+s.facilities.reduce((a,k)=>a+(FAC[k]?.income||0),0)+facilityLevel('shop')*35000+facilityLevel('cafe')*22000;let wages=s.players.reduce((a,p)=>a+p.wage,0);let expenses=wages+85000;s.money+=income-expenses;s.players.forEach(p=>{p.stamina=Math.min(100,p.stamina+7+facilityLevel('spa')*3);p.morale=Math.min(100,p.morale+2)});s.fans+=Math.floor(facilityLevel('shop')*18+facilityLevel('cafe')*12+Math.max(0,power()-50)*1.3);if(s.week%2===0){s.players.filter(p=>p.age<24).forEach(p=>{if(Math.random()<.12+facilityLevel('academy')*.05)p.ov=Math.min(99,p.ov+1)})}note('第'+s.week+'週：収入 '+money(income)+'、運営費 '+money(expenses)+'。疲労が回復した。');s.week++;if(s.week>12)seasonEnd();else render()}
function advanceN(n){for(let i=0;i<n;i++){if(s.week>12)break;let income=s.sponsorIncome+s.facilities.reduce((a,k)=>a+(FAC[k]?.income||0),0)+facilityLevel('shop')*35000+facilityLevel('cafe')*22000,expenses=s.players.reduce((a,p)=>a+p.wage,0)+85000;s.money+=income-expenses;s.players.forEach(p=>{p.stamina=Math.min(100,p.stamina+7+facilityLevel('spa')*3);p.morale=Math.min(100,p.morale+2)});s.fans+=Math.floor(facilityLevel('shop')*18+facilityLevel('cafe')*12);note('第'+s.week+'週を経過。収支 '+money(income-expenses));s.week++;if(s.week>12){seasonEnd(true);break}}render();notify(n+'週分進行しました')}
function seasonEnd(silent=false){let rank=1+(s.table||[]).filter(t=>t.pts>s.points).length;let prize=rank===1?6000000:rank<=3?2800000:1000000;s.money+=prize;note(s.season+'年目終了！ '+rank+'位、賞金 '+money(prize));s.titles=s.titles||[];if(rank===1)s.titles.push('地域リーグ優勝');if(!silent)modal('シーズン終了！','<div class="panel"><h3>'+s.season+'年目の成績</h3><div style="font-size:28px;color:var(--gold);font-weight:1000">'+rank+'位</div><div class="muted">'+s.w+'勝 '+s.d+'分 '+s.l+'敗 · 勝ち点 '+s.points+'</div><div class="row"><span>シーズン賞金</span><b style="color:var(--gold)">'+money(prize)+'</b></div></div><button class="btn gold full" id="nextSeason">新シーズンを開始</button>');if(!silent)$('nextSeason').onclick=()=>newSeason();else newSeason(true)}
function newSeason(silent=false){s.season++;s.week=1;s.points=0;s.w=0;s.d=0;s.l=0;s.gf=0;s.ga=0;s.matchLogs=[];s.table=opponentsBase.map((name,i)=>({name,power:47+(i*7+s.season*3)%20,pts:0,w:0,d:0,l:0,gf:0,ga:0}));s.players.forEach(p=>{p.age++;p.stamina=100;p.morale=Math.min(100,p.morale+12);if(p.age<25&&Math.random()<.4+facilityLevel('academy')*.04)p.ov=Math.min(99,p.ov+1)});note('新シーズン開幕！施設と育成を活用して優勝を目指そう。');if(!silent)close();else render()}
function initLeague(){if(!s.table.length)s.table=opponentsBase.map((name,i)=>({name,power:48+(i*7)%19,pts:0,w:0,d:0,l:0,gf:0,ga:0}))}initLeague();
function playMatch(){kickoffMatch()}
function kickoffMatch(){if(s.week>12){seasonEnd();return}const op=s.table[(s.week-1)%s.table.length],starters=s.players.slice().sort((a,b)=>b.ov-a.ov).slice(0,11);liveMatch={op,starters,my:0,their:0,zone:1,possession:'us',turn:0,clock:5,energy:100,positions:[[.13,.5],[.27,.25],[.27,.42],[.27,.58],[.27,.75],[.46,.25],[.46,.42],[.46,.58],[.46,.75],[.7,.4],[.7,.6]],selectedIndex:0,events:['キックオフ！ '+s.club+' 対 '+op.name+'。味方を指で動かし、行動を選択しよう！']};renderLiveMatch()}
function renderLiveMatch(){if(!liveMatch)return;const m=liveMatch;if(!m.positions)m.positions=[[.13,.5],[.27,.25],[.27,.42],[.27,.58],[.27,.75],[.46,.25],[.46,.42],[.46,.58],[.46,.75],[.7,.4],[.7,.6]];const attack=m.possession==='us',zone=['自陣','中盤','敵陣','ゴール前'][Math.max(0,Math.min(3,m.zone))];const buttons=attack?'<button class="btn" data-match-action="pass">パス</button><button class="btn" data-match-action="dribble">ドリブル</button><button class="btn gold" data-match-action="shoot" '+(m.zone<2?'disabled':'')+'>シュート</button><button class="btn red" data-match-action="special" '+(m.energy<35?'disabled':'')+'>必殺技 ⚡</button>':'<button class="btn gold" data-match-action="tackle">タックル</button><button class="btn" data-match-action="press">プレス</button><button class="btn red" data-match-action="block">必殺ブロック ⚡</button>';modal('試合プレイ｜'+s.club+' vs '+m.op.name,'<div class="grid3"><div class="metric"><label>スコア</label><b style="font-size:22px">'+m.my+' - '+m.their+'</b><small>'+s.club+'</small></div><div class="metric"><label>試合時間</label><b>'+Math.min(90,m.clock)+'分</b><small>プレイ '+m.turn+'/8</small></div><div class="metric"><label>必殺エネルギー</label><b>'+m.energy+'%</b><div class="bar"><i style="width:'+m.energy+'%"></i></div></div></div><div class="muted">ピッチ上の味方選手を指でなぞって移動。その後、下のパス・ドリブル・シュートなどを選択します。</div><div class="pitch" style="height:235px;margin:8px 0;touch-action:none"><canvas id="matchPitch" style="touch-action:none"></canvas></div><div class="panel"><div class="topline"><h3 style="margin:0">'+(attack?'⚽ 攻撃ターン':'🛡️ 守備ターン')+'</h3><span class="pill">'+zone+'</span></div><div class="muted" style="margin-top:6px">'+(attack?(m.zone<2?'パスやドリブルで敵陣へ進もう。':'ゴールを狙える！通常シュートか必殺技を選択。'):'相手の攻撃を止めよう。タックル・プレス・必殺ブロックを選べます。')+'</div><div class="grid2" style="margin-top:10px">'+buttons+'</div></div><div class="secttitle">試合実況 <span class="muted">新しい順</span></div><div class="panel">'+m.events.slice(-5).reverse().map(e=>'<div class="event">'+e+'</div>').join('')+'</div><button class="btn full" data-match-action="forfeit">試合を終了する</button>');drawMatchPitch()}
function drawMatchPitch(){let c=$('matchPitch');if(!c||!liveMatch)return;let r=c.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);if(!r.width||!r.height)return;c.width=r.width*d;c.height=r.height*d;let x=c.getContext('2d');x.scale(d,d);let w=r.width,hh=r.height,m=liveMatch;x.fillStyle='#347c47';x.fillRect(0,0,w,hh);for(let i=0;i<8;i++){x.fillStyle=i%2?'#3c8b52':'#347c47';x.fillRect(i*w/8,0,w/8,hh)}x.strokeStyle='#e0edcf';x.lineWidth=1.5;x.strokeRect(8,8,w-16,hh-16);x.beginPath();x.moveTo(w/2,8);x.lineTo(w/2,hh-8);x.stroke();x.beginPath();x.arc(w/2,hh/2,24,0,Math.PI*2);x.stroke();let pts=m.positions||[];pts.forEach((p,i)=>{x.fillStyle=i===m.selectedIndex?'#f4d477':'#fff5d8';x.beginPath();x.arc(p[0]*w,p[1]*hh,i===m.selectedIndex?9:6,0,Math.PI*2);x.fill();x.strokeStyle='#183323';x.stroke();x.fillStyle='#173526';x.font='bold 8px sans-serif';x.textAlign='center';x.fillText(String(i+1),p[0]*w,p[1]*hh+3)});if(!c.dataset.dragBound){c.dataset.dragBound='1';let moving=-1;const pos=e=>{let rr=c.getBoundingClientRect();return{x:Math.max(.05,Math.min(.95,(e.clientX-rr.left)/rr.width)),y:Math.max(.08,Math.min(.92,(e.clientY-rr.top)/rr.height))}};c.addEventListener('pointerdown',e=>{const q=pos(e),arr=liveMatch&&liveMatch.positions;if(!arr)return;let best=Infinity;moving=-1;arr.forEach((p,i)=>{let dd=Math.hypot((p[0]-q.x)*w,(p[1]-q.y)*hh);if(dd<best){best=dd;moving=i}});if(best<32){liveMatch.selectedIndex=moving;c.setPointerCapture(e.pointerId);e.preventDefault();drawMatchPitch()}else moving=-1});c.addEventListener('pointermove',e=>{if(moving<0||!liveMatch||!liveMatch.positions)return;const q=pos(e);liveMatch.positions[moving]=[q.x,q.y];liveMatch.selectedIndex=moving;drawMatchPitch();e.preventDefault()});const stop=()=>{moving=-1};c.addEventListener('pointerup',stop);c.addEventListener('pointercancel',stop)}}
function rename(){modal('クラブ名を変更','<div class="muted">自分だけのクラブ名を設定できます。</div><input id="clubInput" maxlength="18" value="'+s.club.replace(/"/g,'&quot;')+'" style="width:100%;padding:12px;margin:10px 0;background:#203728;color:#fff7dc;border:1px solid #6b8158;border-radius:5px"><button class="btn gold full" id="renameSave">名前を決定</button>');$('renameSave').onclick=()=>{let n=$('clubInput').value.trim();if(n){s.club=n;note('クラブ名を「'+n+'」に変更した');close()}}}
function act(a){if(a==='match')playMatch();if(a==='scout')negotiateScout();if(a==='sponsor')sponsor();if(a==='build')buildMenu();if(a==='train')tab='train',render();if(a==='save'){save();notify('セーブしました')}if(a==='reset'){modal('本当に最初から？','<div class="muted">これまでのクラブデータを消去して、新しいクラブを開始します。</div><button class="btn red full" id="resetConfirm">データをリセット</button>');$('resetConfirm').onclick=()=>{localStorage.removeItem('footballdays-save-v2');location.reload()}}if(a==='rename')rename()}
document.addEventListener('click',e=>{let b=e.target.closest('button,[data-player]');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.dataset.action)act(b.dataset.action);if(b.dataset.matchAction)matchAction(b.dataset.matchAction);if(b.dataset.build)build(b.dataset.build);if(b.dataset.upgrade)upgradeTile(Number(b.dataset.upgrade));if(b.dataset.candidate)startNegotiation(b.dataset.candidate);if(b.dataset.talk)talk(b.dataset.talk);if(b.dataset.sponsorTalk)sponsorTalk(b.dataset.sponsorTalk);if(b.dataset.train)trainCourse(b.dataset.train);if(b.dataset.formation){s.formation=b.dataset.formation;render();notify('フォーメーションを変更')}if(b.dataset.player){let p=s.players.find(x=>x.id===b.dataset.player);if(p)modal(p.name,'<div class="grid2"><div class="metric"><label>総合能力</label><b>'+p.ov+'</b><small>'+p.pos+' · '+p.age+'歳</small></div><div class="metric"><label>成長ポテンシャル</label><b>'+('★'.repeat(p.potential))+'</b><small>レベル '+p.level+'</small></div><div class="metric"><label>得点</label><b>'+p.goals+'</b><small>出場 '+p.apps+'試合</small></div><div class="metric"><label>コンディション</label><b>'+p.stamina+'%</b><small>モラル '+p.morale+'%</small></div></div><div class="row"><span>移籍評価額</span><b>'+money(p.value)+'</b></div><div class="row"><span>週給</span><b>'+money(p.wage)+'</b></div><button class="btn gold full" style="margin-top:9px" data-player-train="'+p.id+'">個別特訓 · ¥80,000</button>')}if(b.dataset.playerTrain){let p=s.players.find(x=>x.id===b.dataset.playerTrain);if(p&&s.money>=80000){s.money-=80000;p.ov=Math.min(99,p.ov+1);p.stamina=Math.max(30,p.stamina-6);note(p.name+'が個別特訓で成長した');close();notify('能力が上昇しました')}else notify('資金が足りません')}if(b.id==='closeModal')close();if(b.id==='buildBtn')buildMenu();if(b.id==='advanceBtn')advanceN(1);if(b.id==='autoBtn')advanceN(3)});
cv.addEventListener('click',e=>{let r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,w=r.width,h=r.height,tw=Math.min(w/8.7,h/5.5),th=tw*.49,ox=w/2,oy=h*.13,best=-1,dist=1e9;for(let yy=0;yy<5;yy++)for(let xx=0;xx<7;xx++){let px=ox+(xx-yy)*tw*.5,py=oy+(xx+yy)*th*.5+th*.5,d=Math.hypot(px-x,py-y);if(d<dist){dist=d;best=yy*7+xx}}if(best>=0&&dist<tw*.65)tileModal(best)});
$('advanceBtn').onclick=()=>advanceN(1);$('autoBtn').onclick=()=>advanceN(3);$('buildBtn').onclick=buildMenu;$('closeModal').onclick=close;$('modalback').addEventListener('click',e=>{if(e.target===$('modalback'))close()});content.addEventListener('change',e=>{if(e.target.id==='tactic'){s.tactic=e.target.value;save();notify('戦術を変更しました')}});window.addEventListener('resize',drawGround);
render();
