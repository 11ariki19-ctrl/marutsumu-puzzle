<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10251f"><title>タッチライン・マネージャー</title>
<style>
:root{--bg:#0b1714;--panel:#14251f;--panel2:#1b3028;--line:#30483d;--text:#f0f5ee;--muted:#a5b9ac;--lime:#c6f36a;--gold:#ffcf70;--red:#ff7777;--blue:#73caff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}body{padding-bottom:calc(74px + env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none}button,input,select{font:inherit}button{border:0;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--lime)}.app{max-width:760px;margin:auto;min-height:100vh;background:radial-gradient(ellipse at top,#18342a 0,#0b1714 56%)}header{position:sticky;top:0;z-index:5;background:#0d1b17ed;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 15px 10px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.04em;font-size:17px}.brand small{display:block;color:var(--lime);font-size:9px;letter-spacing:.2em;margin-bottom:2px}.money{text-align:right;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}.money small{display:block;color:var(--muted);font-size:10px;font-weight:500}.main{padding:13px;display:grid;gap:12px}.hero{background:linear-gradient(120deg,#254a38,#172c24);border:1px solid #41604c;border-radius:18px;padding:17px;position:relative;overflow:hidden}.hero:after{content:"⚽";position:absolute;right:-5px;top:15px;font-size:76px;opacity:.12}.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--lime);font-weight:800}.hero h1{font-size:25px;line-height:1.2;margin:7px 0}.hero p{color:#c0d0c4;font-size:12px;line-height:1.65;max-width:85%;margin:0}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px;min-width:0}.card h3{font-size:13px;margin:0 0 10px}.muted{color:var(--muted)}.small{font-size:11px}.big{font-size:23px;font-weight:900;letter-spacing:-.03em}.accent{color:var(--lime)}.gold{color:var(--gold)}.btn{padding:12px 14px;border-radius:11px;font-weight:800;font-size:13px;background:var(--panel2);border:1px solid #3d5b4a}.btn.primary{background:var(--lime);color:#172316;border-color:var(--lime)}.btn.ghost{background:transparent}.btn.danger{color:#ffaaaa;border-color:#743f3f}.btn:disabled{opacity:.35}.full{width:100%}.section-title{font-size:16px;font-weight:900;margin:2px 0 0}.tag{font-size:10px;border-radius:7px;padding:4px 7px;background:#263b30;color:#c7d8ca;white-space:nowrap}.tag.good{color:var(--lime);background:#293d23}.tag.bad{color:#ffaaaa;background:#442726}.stat{font-size:10px;color:var(--muted)}.stat b{display:block;color:var(--text);font-size:17px;margin-top:3px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:8;background:#0d1b17f5;border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:3px;backdrop-filter:blur(14px)}.nav button{flex:1;max-width:115px;background:transparent;color:#9ab0a1;border-radius:10px;padding:8px 2px;font-size:10px;font-weight:700}.nav button span{display:block;font-size:18px;margin-bottom:3px}.nav button.active{background:#253c2d;color:var(--lime)}.hidden{display:none!important}.list{display:grid;gap:7px}.item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:11px;background:#1a2b23;border:1px solid #2b4034}.shirt{width:35px;height:35px;border-radius:10px;display:grid;place-items:center;background:#d9f49b;color:#183022;font-weight:900;font-size:12px;flex-shrink:0}.itemmain{flex:1;min-width:0}.itemmain strong{font-size:12px;display:block}.itemmain small{font-size:10px;color:var(--muted)}.rating{font-weight:900;font-size:16px;color:var(--lime)}.pitch{position:relative;width:100%;aspect-ratio: .78;max-height:560px;background:#347b4e;border-radius:13px;overflow:hidden;border:3px solid #80b783;background-image:repeating-linear-gradient(0deg,transparent 0 10%,#ffffff08 10% 20%)}.pitch svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.pmark{position:absolute;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;transform:translate(-50%,-50%);font-size:9px;font-weight:900;border:2px solid white;box-shadow:0 2px 6px #0008;z-index:2}.pmark.home{background:#d9f49b;color:#14261a}.pmark.away{background:#f2f3f4;color:#233}.pmark.ball{width:15px;height:15px;border:1px solid white;background:#ffb83d;font-size:10px;z-index:3}.pitch-label{position:absolute;top:5px;left:8px;font-size:9px;color:#ffffffb0;z-index:1}.control{display:grid;gap:7px;margin:10px 0}.control label{font-size:11px;color:#d2e0d5;display:flex;justify-content:space-between}.control input{width:100%;accent-color:var(--lime)}.scoreboard{background:#0b1714;border:1px solid #375344;border-radius:14px;padding:12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:8px}.scoreboard .score{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}.scoreboard .team{font-size:11px;font-weight:800}.timeline{display:grid;gap:8px}.event{border-left:2px solid #43644e;padding:4px 0 4px 10px;font-size:11px;color:#d4e1d6}.event b{color:var(--lime);margin-right:7px}.tabs{display:flex;gap:6px;overflow:auto;padding:2px 0 5px}.tabs button{white-space:nowrap;padding:8px 11px;border-radius:9px;background:#172921;color:#a9bcaf;font-size:11px;font-weight:800}.tabs button.active{background:var(--lime);color:#18251b}.notice{padding:10px;border-radius:10px;background:#253a2c;color:#d9e8db;font-size:11px;line-height:1.6}.progress{height:5px;background:#34473a;border-radius:9px;overflow:hidden;margin-top:5px}.progress i{display:block;height:100%;background:var(--lime)}.pill{border-radius:999px;background:#263b30;padding:5px 9px;font-size:10px}.overlay{position:fixed;inset:0;background:#07100deF;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px}.modal{max-width:440px;width:100%;background:#14251f;border:1px solid #43604e;border-radius:19px;padding:20px;max-height:90vh;overflow:auto}.modal h2{font-size:22px;margin:8px 0}.modal p{font-size:12px;color:var(--muted);line-height:1.7}.input{width:100%;background:#0b1714;color:white;border:1px solid #3c5747;border-radius:10px;padding:12px;margin:5px 0 12px}.toast{position:fixed;z-index:30;left:50%;bottom:90px;transform:translateX(-50%);background:#f0f5ee;color:#102018;padding:10px 15px;border-radius:11px;font-size:12px;font-weight:800;box-shadow:0 8px 25px #0006;max-width:90%;text-align:center}.footer-note{text-align:center;font-size:10px;color:#6f8978;padding:8px 0 15px}@media(min-width:600px){.main{padding:18px}.pitch{aspect-ratio:1.25}.pmark{width:32px;height:32px;font-size:10px}.grid2.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body><div class="app">
<header><div class="brand"><small>FOOTBALL CLUB SIMULATION</small>タッチライン・マネージャー</div><div class="money"><span id="cash">¥120,000,000</span><small id="seasonHead">シーズン 2026 / 第1節</small></div></header>
<main class="main" id="screen"></main>
<nav class="nav" id="nav"><button data-tab="home" class="active"><span>⌂</span>ホーム</button><button data-tab="team"><span>♙</span>チーム</button><button data-tab="tactics"><span>⚙</span>戦術</button><button data-tab="match"><span>⚽</span>試合</button><button data-tab="club"><span>▥</span>クラブ</button></nav>
<div class="footer-note">架空のクラブ・選手によるオリジナルゲーム / セーブはこの端末内に保存</div>
</div>
<div class="overlay" id="setup"><div class="modal"><div class="eyebrow">YOUR FOOTBALL STORY STARTS HERE</div><h2>クラブの指揮を執ろう。</h2><p>小さなクラブを率いて、戦術・育成・補強で頂点を目指す。試合中も選手の位置が動く、スマホ向け監督シミュレーション。</p><label class="small muted">監督名</label><input id="managerName" class="input" value="新米監督" maxlength="12"><label class="small muted">クラブを選ぶ</label><select id="clubChoice" class="input"><option value="minato">港町ユナイテッド — 資金は少なめ、若手中心</option><option value="kyoto">京都フォレスト — バランス型</option><option value="osaka">大阪アトラス — 攻撃力重視</option></select><button id="startGame" class="btn primary full">監督に就任する →</button><p class="small">ゲーム内のクラブ・選手・リーグはすべて架空です。</p></div></div>
<div id="toast" class="toast hidden"></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const positions=['GK','RB','CB','CB','LB','DM','CM','CM','RW','ST','LW'];
const formationSets={
'4-3-3':[[50,91],[78,76],[61,80],[39,80],[22,76],[50,66],[66,53],[36,53],[79,32],[50,26],[21,32]],
'4-2-3-1':[[50,91],[78,76],[61,80],[39,80],[22,76],[42,65],[58,65],[50,48],[78,36],[50,27],[22,36]],
'4-4-2':[[50,91],[78,76],[61,80],[39,80],[22,76],[78,54],[59,56],[41,56],[22,54],[61,29],[39,29]],
'3-5-2':[[50,91],[66,80],[50,82],[34,80],[87,56],[67,59],[50,53],[33,59],[13,56],[60,29],[40,29]],
'5-3-2':[[50,91],[85,73],[67,79],[50,81],[33,79],[15,73],[68,55],[50,52],[32,55],[60,29],[40,29]]
};
const names=['佐伯','高橋','森','石田','山本','田中','小林','井上','中村','吉田','斎藤','山田','清水','松本','池田','橋本','山口','阿部','藤田','岡田','長谷川','前田','石井','近藤','坂本','遠藤','青木','藤井','西村','福田','太田','三浦','岡本'];
const surnames=['蓮','湊','陽翔','大和','悠真','颯太','陸','樹','蒼','晴','拓海','一颯','海斗','翔','健太','亮','悠斗','直樹'];
const roleNames=['守護神','攻撃的SB','ビルドアップCB','ストッパー','上下動SB','アンカー','司令塔','ボックス・トゥ・ボックス','突破型WG','裏抜けストライカー','カットインWG'];
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>'¥'+Math.round(n).toLocaleString('ja-JP');
let state=null,tab='home',matchState=null,simTimer=null;
function player(id,pos,skill){return {id,name:pick(names)+pick(surnames),pos,role:roleNames[positions.indexOf(pos)]||'ユーティリティ',age:rand(18,31),ovr:skill??rand(48,70),pace:rand(45,85),pass:rand(45,85),shoot:rand(40,84),def:rand(40,85),stamina:rand(70,100),fitness:100,morale:rand(55,85),potential:rand(65,88),wage:rand(300000,1800000),apps:0,goals:0,assists:0,yellow:0,red:0})}
function newState(club,manager){let c={minato:{name:'港町ユナイテッド',cash:120000000,skill:56,rep:1},kyoto:{name:'京都フォレスト',cash:180000000,skill:61,rep:2},osaka:{name:'大阪アトラス',cash:260000000,skill:65,rep:3}}[club];let squad=positions.map((p,i)=>player(i+1,p,rand(c.skill-9,c.skill+10)));for(let i=0;i<7;i++)squad.push(player(12+i,['GK','CB','CM','CM','RW','ST','LB'][i],rand(c.skill-13,c.skill+3)));return {manager,club:c.name,cash:c.cash,season:2026,week:1,points:0,wins:0,draws:0,losses:0,played:0,goalsFor:0,goalsAgainst:0,rep:c.rep,formation:'4-3-3',tactics:{line:55,press:55,width:55,tempo:55,attack:55},style:'balanced',squad,starting:squad.slice(0,11).map(p=>p.id),bench:squad.slice(11,16).map(p=>p.id),league:makeLeague(c.skill,c.name),history:[],lastMatch:null,facilities:1,academy:1,scout:1,fan:3400,training:'balanced',market:makeMarket(c.skill),sponsor:18000000,managerExp:0}}
function makeLeague(skill,clubName){const clubs=[clubName,'港町ユナイテッド','京都フォレスト','大阪アトラス','北都ブリザード','横浜マリナーズ','神戸シーガルズ','名古屋グリフォン','福岡オーシャンズ','仙台ノーススター','広島フェニックス'].filter((name,i,a)=>a.indexOf(name)===i);return clubs.slice(0,10).map((name,i)=>({name,skill:name===clubName?skill:skill+rand(-12,13),pts:0,w:0,d:0,l:0,gf:0,ga:0,our:name===clubName}))}
function makeMarket(skill){return Array.from({length:8},(_,i)=>player(100+i,['GK','CB','CB','DM','CM','RW','ST','LW'][i],rand(skill-10,skill+12)))}
function save(){try{localStorage.setItem('touchline_manager_save',JSON.stringify(state))}catch(e){}}
function load(){try{let s=localStorage.getItem('touchline_manager_save');return s?JSON.parse(s):null}catch(e){return null}}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.add('hidden'),2200)}
function nav(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
function setTab(t){tab=t;nav();render()}
function teamOvr(ids){let a=state.squad.filter(p=>ids.includes(p.id));return Math.round(a.reduce((s,p)=>s+p.ovr*p.fitness/100,0)/(a.length||1))}
function moraleText(n){return n>=75?'良好':n>=55?'普通':'不満'}
function home(){let next=state.league.filter(c=>!c.our).sort((a,b)=>a.pts-b.pts)[state.week%9];return '<section class="hero"><div class="eyebrow">MANAGER CAREER / '+state.season+'</div><h1>'+state.club+'</h1><p>'+state.manager+' 監督、クラブの未来はあなたの采配次第。戦術を整え、選手を育て、次の試合で勝点をつかもう。</p><div class="row" style="margin-top:15px"><span class="tag good">'+state.formation+'</span><span class="tag">第'+state.week+'節</span><span class="tag">支持 '+state.fan.toLocaleString()+'人</span></div></section><div class="grid2 three"><div class="card"><div class="stat">リーグ順位</div><div class="big accent">'+rank()+'位</div><div class="small muted">'+state.points+' pt</div></div><div class="card"><div class="stat">戦績</div><div class="big">'+state.wins+'-'+state.draws+'-'+state.losses+'</div><div class="small muted">'+state.played+'試合</div></div><div class="card"><div class="stat">チーム総合</div><div class="big">'+teamOvr(state.starting)+'</div><div class="small muted">先発11人</div></div></div><section class="card"><div class="row between"><h3>次の試合</h3><span class="tag">リーグ戦</span></div><div class="row between" style="margin:15px 0"><div><div class="small muted">HOME</div><strong>'+state.club+'</strong></div><div class="big">VS</div><div style="text-align:right"><div class="small muted">AWAY</div><strong>'+opponent().name+'</strong></div></div><div class="row"><button class="btn primary full" onclick="window.goMatch()">試合の準備をする →</button></div></section><div class="grid2"><div class="card"><div class="row between"><h3>選手コンディション</h3><span class="tag">'+state.training+'</span></div>'+state.squad.slice(0,3).map(p=>'<div style="margin:8px 0"><div class="row between small"><span>'+p.name+'</span><span>'+p.fitness+'%</span></div><div class="progress"><i style="width:'+p.fitness+'%"></i></div></div>').join('')+'</div><div class="card"><h3>クラブ財政</h3><div class="big gold">'+fmt(state.cash)+'</div><div class="small muted">スポンサー収入 '+fmt(state.sponsor)+'/節</div><button class="btn full" style="margin-top:10px" onclick="window.goTab(\'club\')">経営を確認</button></div></div><div class="notice">戦術の変更は選手の立ち位置と走り方に影響します。ハイラインは相手ゴールに近づけますが、裏のスペースが広がります。</div>'}
function rank(){return [...state.league].sort((a,b)=>b.pts-a.pts||((b.gf-b.ga)-(a.gf-a.ga))).findIndex(c=>c.our)+1}
function opponent(){let o=state.league.filter(c=>!c.our);return o[(state.week-1)%o.length]}
function renderTeam(){let starters=state.squad.filter(p=>state.starting.includes(p.id));return '<div class="row between"><div><div class="section-title">スカッド</div><div class="small muted">登録選手 '+state.squad.length+'人 / 先発11人</div></div><span class="tag good">総合 '+teamOvr(state.starting)+'</span></div><div class="card"><div class="row between"><h3>先発メンバー</h3><select class="input" style="width:auto;padding:7px;margin:0" onchange="window.changeFormation(this.value)">'+Object.keys(formationSets).map(f=>'<option '+(f===state.formation?'selected':'')+'>'+f+'</option>').join('')+'</select></div><div class="pitch" id="lineupPitch"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><rect x="2" y="2" width="96" height="96" fill="none" stroke="#ffffff9c" stroke-width=".6"/><line x1="2" y1="50" x2="98" y2="50" stroke="#ffffff9c" stroke-width=".6"/><circle cx="50" cy="50" r="11" fill="none" stroke="#ffffff9c" stroke-width=".6"/><rect x="26" y="2" width="48" height="15" fill="none" stroke="#ffffff9c" stroke-width=".6"/><rect x="26" y="83" width="48" height="15" fill="none" stroke="#ffffff9c" stroke-width=".6"/><rect x="39" y="2" width="22" height="5" fill="none" stroke="#ffffff9c" stroke-width=".6"/><rect x="39" y="93" width="22" height="5" fill="none" stroke="#ffffff9c" stroke-width=".6"/></svg>'+starters.map((p,i)=>{let pos=formationSets[state.formation][i]||formationSets['4-3-3'][i];return '<button class="pmark home" style="left:'+pos[0]+'%;top:'+pos[1]+'%" onclick="window.playerDetail('+p.id+')">'+p.pos+'</button>'}).join('')+'</div><div class="small muted" style="margin-top:8px">ピッチ上のポジションをタップすると選手の詳細を確認できます。</div></div><div class="tabs"><button class="active">選手一覧</button><button onclick="window.sortPlayers()">能力順に並べ替え</button><button onclick="window.goTab(\'club\')">移籍市場へ</button></div><div class="list">'+state.squad.map(p=>'<div class="item" onclick="window.playerDetail('+p.id+')"><div class="shirt">'+p.pos+'</div><div class="itemmain"><strong>'+p.name+' <span class="muted">#'+p.id+'</span></strong><small>'+p.age+'歳 · '+(state.starting.includes(p.id)?'先発':state.bench.includes(p.id)?'ベンチ':'控え')+' · '+moraleText(p.morale)+' · 体力 '+p.fitness+'%</small></div><div class="rating">'+p.ovr+'</div><button class="btn" style="padding:7px 9px" onclick="event.stopPropagation();window.toggleStarter('+p.id+')">'+(state.starting.includes(p.id)?'外す':'起用')+'</button></div>').join('')+'</div>'}
function renderTactics(){return '<div><div class="section-title">戦術ボード</div><p class="small muted">スライダーを動かすと、試合中の選手の位置・守備範囲・攻撃テンポに反映されます。</p></div><div class="card"><div class="row between"><h3>基本フォーメーション</h3><span class="tag good">'+state.formation+'</span></div><div class="grid2">'+Object.keys(formationSets).map(f=>'<button class="btn '+(state.formation===f?'primary':'')+'" onclick="window.changeFormation(\''+f+'\')">'+f+'</button>').join('')+'</div><div class="control"><label>最終ラインの高さ <b id="lineVal">'+state.tactics.line+'</b></label><input type="range" min="15" max="90" value="'+state.tactics.line+'" oninput="window.tactic(\'line\',this.value)"><div class="row between small muted"><span>低く構える</span><span>ハイライン</span></div></div><div class="control"><label>プレス強度 <b id="pressVal">'+state.tactics.press+'</b></label><input type="range" min="10" max="95" value="'+state.tactics.press+'" oninput="window.tactic(\'press\',this.value)"><div class="row between small muted"><span>リトリート</span><span>ハイプレス</span></div></div><div class="control"><label>攻撃の幅 <b id="widthVal">'+state.tactics.width+'</b></label><input type="range" min="15" max="95" value="'+state.tactics.width+'" oninput="window.tactic(\'width\',this.value)"><div class="row between small muted"><span>中央</span><span>ワイド</span></div></div><div class="control"><label>パス・攻撃テンポ <b id="tempoVal">'+state.tactics.tempo+'</b></label><input type="range" min="15" max="95" value="'+state.tactics.tempo+'" oninput="window.tactic(\'tempo\',this.value)"><div class="row between small muted"><span>保持</span><span>ダイレクト</span></div></div><div class="control"><label>攻撃の重心 <b id="attackVal">'+state.tactics.attack+'</b></label><input type="range" min="15" max="95" value="'+state.tactics.attack+'" oninput="window.tactic(\'attack\',this.value)"><div class="row between small muted"><span>慎重</span><span>前がかり</span></div></div><button class="btn primary full" onclick="window.saveTactics()">戦術を保存する</button></div><div class="card"><h3>戦術の特徴</h3><div id="tacticAnalysis">'+tacticAnalysis()+'</div></div>'}

window.endMatch()">試合を終了して結果へ</button></div>'}

e()">セーブデータを削除して最初から</button>'}
function render(){if(!state)return;nav();$('cash').textContent=fmt(state.cash);$('seasonHead').textContent='シーズン '+state.season+' / 第'+state.week+'節';let html=tab==='home'?home():tab==='team'?renderTeam():tab==='tactics'?renderTactics():tab==='match'?renderMatch():renderClub();$('screen').innerHTML=html}
function detail(id){let p=state.squad.find(p=>p.id===id);if(!p)return;let modal=document.createElement('div');modal.className='overlay';modal.innerHTML='<div class="modal"><div class="row between"><span class="tag good">'+p.pos+'</span><button class="btn" id="closePlayer">閉じる</button></div><h2>'+p.name+'</h2><div class="big accent">'+p.ovr+' <span class="small muted">総合</span></div><p>'+p.age+'歳 · 潜在能力 '+p.potential+' · '+(state.starting.includes(id)?'先発メンバー':'控え選手')+'</p><div class="grid2">'+[['スピード',p.pace],['パス',p.pass],['シュート',p.shoot],['守備',p.def],['体力',p.fitness],['士気',p.morale]].map(a=>'<div class="card"><div class="stat">'+a[0]+'</div><div class="big">'+a[1]+'</div><div class="progress"><i style="width:'+a[1]+'%"></i></div></div>').join('')+'</div><div class="notice" style="margin:12px 0">出場 '+p.apps+'試合 · '+p.goals+'ゴール · '+p.assists+'アシスト<br>週給 '+fmt(p.wage)+' · 状態 '+moraleText(p.morale)+'</div><button class="btn primary full" id="togglePlayer">'+(state.starting.includes(id)?'先発から外す':'先発に起用する')+'</button></div>';document.body.appendChild(modal);modal.querySelector('#closePlayer').onclick=()=>modal.remove();modal.querySelector('#togglePlayer').onclick=()=>{modal.remove();toggleStarter(id)}}
function toggleStarter(id){if(state.starting.includes(id)){let old=state.starting.indexOf(id);if(old===0){toast('GKは必ず1人起用してください');return}state.starting.splice(old,1);let next=state.squad.find(p=>!state.starting.includes(p.id)&&p.pos===state.squad.find(x=>x.id===id).pos);if(!next)next=state.squad.find(p=>!state.starting.includes(p.id));if(next)state.starting.push(next.id)}else{let p=state.squad.find(p=>p.id===id);let old=state.starting.findIndex(pid=>state.squad.find(x=>x.id===pid).pos===p.pos);if(old<0)old=10;state.starting[old]=id}save();render()}
function changeFormation(f){state.formation=f;save();render();toast('フォーメーションを '+f+' に変更')}
function tactic(k,v){state.tactics[k]=Number(v);let el=$(k+'Val');if(el)el.textContent=v}
function saveTactics(){save();if($('tacticAnalysis'))$('tacticAnalysis').innerHTML=tacticAnalysis();toast('戦術を保存しました')}
function sortPlayers(){state.squad.sort((a,b)=>b.ovr-a.ovr);save();render()}
function opponentLineup(opp){return Array.from({length:11},(_,i)=>({x:formationSets['4-3-3'][i][0],y:100-formationSets['4-3-3'][i][1],baseX:formationSets['4-3-3'][i][0],baseY:100-formationSets['4-3-3'][i][1]}))}
function kickoff(){if(matchState&&!matchState.done)return;let t=state.tactics;matchState={min:0,hg:0,ag:0,opp:opponent(),events:[{min:0,text:'キックオフ。'+state.formation+'で試合に入る。'}],homePlayers:formationSets[state.formation].map((p,i)=>({x:p[0],y:p[1],baseX:p[0],baseY:p[1]})),awayPlayers:opponentLineup(opponent()),ball:{x:50,y:50},shotsH:0,shotsA:0,poss:50,xgh:0,xga:0,pass:state.tactics.tempo>70?78:84,done:false};state.squad.filter(p=>state.starting.includes(p.id)).forEach(p=>{p.apps++});setTab('match');simTimer=setInterval(stepMatch,850)}
function stepMatch(){if(!matchState||matchState.done)return;let m=matchState;m.min+=2;let t=state.tactics;let homeAttack=state.squad.filter(p=>state.starting.includes(p.id)).reduce((s,p)=>s+p.shoot*.3+p.pass*.2+p.ovr*.5,0)/11;let awayAttack=m.opp.skill;let homePressure=(t.press-50)*.10+(t.attack-50)*.08+(t.tempo-50)*.05;let hline=m.homePlayers,aline=m.awayPlayers;let attacking=Math.random()<(0.5+homePressure*.006)?'home':'away';if(Math.random()<.48){let from=attacking==='home'?hline:aline,to=attacking==='home'?aline:hline;let ix=rand(1,10),target=from[ix];m.ball.x=Math.max(5,Math.min(95,target.x+rand(-10,10)));m.ball.y=Math.max(5,Math.min(95,target.y+rand(-7,7)));m.events.push({min:m.min,text:(attacking==='home'?state.club:m.opp.name)+'が前進。'+(t.press>70?'前線から強く追い込む。':t.width>70?'サイドに展開する。':'パスをつないで攻める。')})}else{m.ball.x=rand(15,85);m.ball.y=rand(15,85)}
for(let i=0;i<11;i++){let h=hline[i],a=aline[i];let lineShift=(t.line-50)*.13,attackShift=(t.attack-50)*.10,widthShift=(t.width-50)*.08,pressShift=(t.press-50)*.08;h.baseY=formationSets[state.formation][i][1];let targetY=h.baseY-lineShift-attackShift;if(m.ball.y<50)targetY+=pressShift;h.x=h.x+(Math.max(4,Math.min(96,formationSets[state.formation][i][0]+(i===0?0:(Math.random()-.5)*widthShift*2)))-h.x)*.24;h.y=h.y+(Math.max(4,Math.min(96,targetY+(Math.random()-.5)*5))-h.y)*.25;a.x+=(Math.max(4,Math.min(96,a.baseX+(m.ball.x-a.x)*.12))-a.x)*.19;a.y+=(Math.max(4,Math.min(96,a.baseY+(m.ball.y-a.y)*.10))-a.y)*.19}
if(m.min>=90){clearInterval(simTimer);simTimer=null;finishMatch();return}
let homeChance=.028+Math.max(0,homeAttack-awayAttack)*.0009+Math.max(0,t.attack-50)*.00045+Math.max(0,t.tempo-60)*.0002-Math.max(0,t.line-72)*.0003;let awayChance=.024+Math.max(0,awayAttack-homeAttack)*.001+Math.max(0,t.line-65)*.0005+Math.max(0,t.press-75)*.0002;
if(Math.random()<homeChance){m.hg++;m.shotsH++;m.xgh+=.25;m.events.push({min:m.min,text:'⚽ ゴール！ '+state.club+'がチャンスを仕留めた！'});m.ball.x=50;m.ball.y=24}else if(Math.random()<awayChance){m.ag++;m.shotsA++;m.xga+=.24;m.events.push({min:m.min,text:'失点。'+m.opp.name+'の攻撃を止められなかった。'});m.ball.x=50;m.ball.y=76}else if(Math.random()<.15){if(Math.random()<.52){m.shotsH++;m.xgh+=.08}else{m.shotsA++;m.xga+=.07}}
m.poss=Math.max(35,Math.min(65,Math.round(50+(t.tempo-50)*.12+(t.press-50)*.08+(Math.random()-.5)*8)));let score=$('liveScore');if(score)score.textContent=m.hg+' - '+m.ag;let min=$('liveMin');if(min)min.textContent=m.min+"'";let ball=$('ball');if(ball){ball.style.left=m.ball.x+'%';ball.style.top=m.ball.y+'%'}for(let i=0;i<11;i++){let h=$('hp'+i),a=$('ap'+i);if(h){h.style.left=hline[i].x+'%';h.style.top=hline[i].y+'%'}if(a){a.style.left=aline[i].x+'%';a.style.top=aline[i].y+'%'}}let log=$('liveEvents');if(log)log.innerHTML=m.events.slice(-5).map(e=>'<div class="event"><b>'+e.min+"'</b>"+e.text+'</div>').join('');}
function finishMatch(){let m=matchState;if(!m)return;m.done=true;let result=m.hg>m.ag?'勝利':m.hg===m.ag?'引き分け':'敗戦';state.played++;state.goalsFor+=m.hg;state.goalsAgainst+=m.ag;if(m.hg>m.ag){state.wins++;state.points+=3;state.fan+=rand(120,450);state.cash+=state.sponsor*.4;state.managerExp+=3}else if(m.hg===m.ag){state.draws++;state.points++;state.fan+=rand(10,120);state.cash+=state.sponsor*.25;state.managerExp+=2}else{state.losses++;state.fan=Math.max(100,state.fan-rand(20,90));state.cash+=state.sponsor*.15;state.managerExp++}let me=state.league.find(c=>c.our);me.pts=state.points;me.w=state.wins;me.d=state.draws;me.l=state.losses;me.gf=state.goalsFor;me.ga=state.goalsAgainst;m.opp.pts+=m.hg===m.ag?1:m.ag>m.hg?3:0;m.opp.gf+=m.ag;m.opp.ga+=m.hg;if(m.hg===m.ag)m.opp.d++;else if(m.hg>m.ag)m.opp.l++;else m.opp.w++;state.squad.filter(p=>state.starting.includes(p.id)).forEach(p=>{p.fitness=Math.max(25,p.fitness-rand(9,19));p.morale=Math.min(100,Math.max(25,p.morale+(m.hg>m.ag?7:m.hg===m.ag?1:-7)));if(p.pos==='ST'||p.pos==='RW'||p.pos==='LW'){p.goals+=Math.random()<(m.hg/11)?1:0}if(p.ovr<p.potential&&Math.random()<.1)p.ovr++});state.lastMatch={home:state.club,away:m.opp.name,hg:m.hg,ag:m.ag,result,shotsH:m.shotsH+rand(2,5),shotsA:m.shotsA+rand(1,4),poss:m.poss,xgh:m.xgh.toFixed(2),xga:m.xga.toFixed(2),pass:m.pass,events:m.events};save();render();toast(result+'！ 試合終了');}
function endMatch(){if(simTimer){clearInterval(simTimer);simTimer=null}while(matchState&&!matchState.done&&matchState.min<90){let before=matchState.min;stepMatch();if(matchState.min===before)break}if(matchState&&!matchState.done)finishMatch()}
function quickResult(){if(simTimer){clearInterval(simTimer);simTimer=null}kickoff();if(simTimer){clearInterval(simTimer);simTimer=null}while(matchState&&!matchState.done&&matchState.min<90){let before=matchState.min;stepMatch();if(matchState.min===before)break}if(matchState&&!matchState.done)finishMatch()}
function nextMatch(){matchState=null;state.lastMatch=null;state.week++;if(state.week>9){state.week=1;state.season++;state.squad.forEach(p=>{p.age++;p.fitness=Math.min(100,p.fitness+rand(20,35));p.morale=65; if(p.age>32&&Math.random()<.25)p.ovr--});state.cash+=state.sponsor*3;state.squad.forEach(p=>{p.fitness=Math.min(100,p.fitness+15)});state.market=makeMarket(teamOvr(state.starting));state.league.forEach(c=>{if(!c.our){c.pts=0;c.w=c.d=c.l=c.gf=c.ga=0}});state.points=state.wins=state.draws=state.losses=state.played=state.goalsFor=state.goalsAgainst=0;state.history.push({season:state.season-1,rank:rank(),points:state.points});toast('新シーズン開幕！')}state.squad.forEach(p=>{p.fitness=Math.min(100,p.fitness+(state.training==='recovery'?20:12));p.morale=Math.min(100,p.morale+2)});state.cash-=state.squad.reduce((s,p)=>s+p.wage,0);state.cash=Math.max(0,state.cash);state.cash+=state.sponsor;state.lastMatch=null;save();setTab('home')}
function signPlayer(id){let p=state.market.find(p=>p.id===id);if(!p)return;let fee=p.ovr*1800000;if(state.cash<fee){toast('資金が足りません');return}if(state.squad.length>=28){toast('登録枠がいっぱいです');return}state.cash-=fee;p.id=Math.max(...state.squad.map(p=>p.id))+1;state.squad.push(p);state.market=state.market.filter(x=>x.id!==id);save();render();toast(p.name+'を獲得しました')}
function upgrade(k){let fee=({facilities:25000000,academy:20000000,scout:18000000})[k]*state[k];if(state.cash<fee){toast('資金が足りません');return}state.cash-=fee;state[k]++;if(k==='academy')state.squad.filter(p=>p.age<23).forEach(p=>{if(p.ovr<p.potential)p.ovr++});if(k==='scout')state.market=makeMarket(teamOvr(state.starting)+state.scout*2);save();render();toast('施設を強化しました')}
function training(k){state.training=k;let rate=k==='attack'?'攻撃強化':k==='defense'?'守備強化':k==='recovery'?'回復重視':'総合練習';state.squad.forEach(p=>{p.fitness=Math.min(100,p.fitness+(k==='recovery'?18:4));if(k==='attack'&&['ST','RW','LW','CM'].includes(p.pos))p.shoot=Math.min(99,p.shoot+1);if(k==='defense'&&['GK','CB','RB','LB','DM'].includes(p.pos))p.def=Math.min(99,p.def+1);if(k==='balanced'&&p.ovr<p.potential&&Math.random()<.15)p.ovr++});state.training=rate;save();render();toast(rate+'を実施しました')}
function liveTactic(k){if(k==='press')state.tactics.press=Math.min(95,state.tactics.press+10);if(k==='line')state.tactics.line=Math.max(15,state.tactics.line-10);if(k==='attack')state.tactics.attack=Math.min(95,state.tactics.attack+10);if(k==='tempo')state.tactics.tempo=state.tactics.tempo>65?40:80;save();toast('戦術を変更しました')}
function resetSave(){if(!confirm('この端末のセーブデータを削除しますか？'))return;localStorage.removeItem('touchline_manager_save');state=null;matchState=null;if(simTimer)clearInterval(simTimer);$('setup').classList.remove('hidden');$('screen').innerHTML='';}
function start(){state=newState($('clubChoice').value,$('managerName').value.trim()||'新米監督');save();$('setup').classList.add('hidden');setTab('home')}
window.goTab=setTab;window.goMatch=()=>setTab('match');window.playerDetail=detail;window.toggleStarter=toggleStarter;window.changeFormation=changeFormation;window.tactic=tactic;window.saveTactics=saveTactics;window.sortPlayers=sortPlayers;window.kickoff=kickoff;window.endMatch=endMatch;window.quickResult=quickResult;window.nextMatch=nextMatch;window.signPlayer=signPlayer;window.upgrade=upgrade;window.training=training;window.liveTactic=liveTactic;window.resetSave=resetSave;
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));$('startGame').addEventListener('click',start);
state=load();if(state){$('setup').classList.add('hidden');setTab('home')}else $('setup').classList.remove('hidden');
})();
</script></body></html>
