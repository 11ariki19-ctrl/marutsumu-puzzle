<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#fff3f8"><title>まるツムパズル</title>
<style>
:root{--pink:#ff76a8;--purple:#8d7bff;--ink:#42364f;--bg:#fff3f8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#fff4f8,#f0f0ff);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;color:var(--ink);min-height:100vh}.app{max-width:520px;margin:auto;padding:16px 14px 28px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:1000;font-size:26px;letter-spacing:-1px;color:#ff5798;text-shadow:1px 2px #fff}.pill{background:#fff;border-radius:20px;padding:8px 12px;font-weight:800;box-shadow:0 3px 12px #d8c6da55}.hero{margin:14px 0;background:linear-gradient(120deg,#ff92b9,#a999ff);border-radius:24px;padding:16px;color:white;box-shadow:0 8px 20px #c9a5d766}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#ffffff30;border:1px solid #ffffff55;border-radius:14px;padding:8px;text-align:center}.stat small{display:block;font-size:11px;opacity:.9}.stat strong{font-size:22px}.playarea{background:#fff;border:4px solid #fff;border-radius:24px;padding:10px;box-shadow:0 8px 24px #bfa4c844}.board{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;touch-action:none;user-select:none}.orb{border:0;border-radius:50%;aspect-ratio:1;min-width:0;padding:0;display:grid;place-items:center;font-size:clamp(20px,6.2vw,34px);background:#f6f2ff;box-shadow:inset 0 -3px #0000000b;transition:transform .08s;cursor:pointer}.orb.selected{transform:scale(.84);outline:3px solid #ff5c9c;z-index:1}.orb.empty{visibility:hidden}.controls{display:flex;gap:8px;margin-top:12px}.btn{border:0;border-radius:16px;padding:13px 10px;font-weight:900;font-size:15px;cursor:pointer;flex:1;background:#ff6ca5;color:white;box-shadow:0 4px #d84e89}.btn.secondary{background:#9281ff;box-shadow:0 4px #6b5cd1}.btn:disabled{opacity:.5}.hint{text-align:center;font-size:12px;line-height:1.6;color:#897b91;margin:12px 4px}.section{background:#fff;border-radius:20px;padding:14px;margin-top:14px;box-shadow:0 5px 18px #d3bed533}.section h2{font-size:16px;margin:0 0 10px}.collection{display:flex;gap:8px;flex-wrap:wrap}.char{background:#fff5fa;border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800}.char span{font-size:24px}.locked{filter:grayscale(1);opacity:.5}.bar{height:10px;background:#eee8f6;border-radius:9px;overflow:hidden;margin-top:8px}.bar>div{height:100%;background:linear-gradient(90deg,#ff77a9,#a18aff);width:0;transition:width .2s}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#493950;color:white;padding:12px 18px;border-radius:22px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}.toast.show{opacity:1}.overlay{position:fixed;inset:0;background:#37243d99;display:grid;place-items:center;padding:20px}.modal{max-width:340px;width:100%;background:white;border-radius:24px;padding:24px;text-align:center}.modal h2{margin-top:0}.modal .btn{width:100%;margin-top:8px}@media(min-width:520px){.orb{font-size:34px}.app{padding-top:22px}}
</style></head>
<body><main class="app">
<header class="top"><div class="logo">まるツムパズル ✨</div><div class="pill">⭐ <span id="best">0</span></div></header>
<section class="hero"><div class="stats"><div class="stat"><small>スコア</small><strong id="score">0</strong></div><div class="stat"><small>のこり時間</small><strong><span id="time">60</span><small style="display:inline">秒</small></strong></div><div class="stat"><small>コンボ</small><strong id="combo">0</strong></div></div><div class="bar"><div id="skillbar"></div></div><div style="display:flex;justify-content:space-between;font-size:11px;margin-top:5px"><span>✨ スキルゲージ</span><span id="skilltext">あと 100</span></div></section>
<section class="playarea"><div id="board" class="board" aria-label="パズル盤面"></div><div class="controls"><button id="skill" class="btn secondary" disabled>✨ スキル</button><button id="start" class="btn">ゲームスタート</button></div></section>
<p class="hint">同じ顔のまるを指でなぞってつなごう！<br>3個以上つなぐと消えるよ。長くつなぐほど高得点！</p>
<section class="section"><h2>🎯 今日のミッション</h2><div id="mission">まるを合計30個消そう！</div><div class="bar"><div id="missionbar"></div></div><p style="font-size:12px;margin-bottom:0;color:#93839c">消した数：<b id="cleared">0</b> / 30</p></section>
<section class="section"><h2>📚 なかまたち</h2><div id="collection" class="collection"></div></section>
</main><div id="toast" class="toast"></div><div id="overlay" class="overlay" style="display:none"><div class="modal"><h2 id="resulttitle">おつかれさま！</h2><p id="resulttext"></p><button id="again" class="btn">もう一度あそぶ</button></div></div>
<script>
(()=>{'use strict';
const chars=[{id:'p',name:'ももまる',face:'🐰',color:'#ffe0ec'},{id:'b',name:'そらまる',face:'🐻',color:'#dcecff'},{id:'y',name:'ぷりんまる',face:'🐥',color:'#fff0b8'},{id:'g',name:'みどまる',face:'🐸',color:'#d8f6dc'},{id:'v',name:'ぶどうまる',face:'🐱',color:'#e9ddff'},{id:'o',name:'みかんまる',face:'🦊',color:'#ffe3cb'}];
const N=7, TOTAL=49;let board=[],score=0,time=60,combo=0,skill=0,cleared=0,running=false,dragging=false,path=[],timer=null,locked=false,unlocked=new Set(['p','b','y']),best=Number(localStorage.getItem('marutsumu-best')||0);
const $=id=>document.getElementById(id);const rand=()=>Math.floor(Math.random()*chars.length);const face=id=>chars[id].face;
function init(){board=Array.from({length:TOTAL},rand);draw();renderCollection();update();$('best').textContent=best}
function draw(){const root=$('board');root.innerHTML='';board.forEach((id,i)=>{const b=document.createElement('button');b.className='orb'+(path.includes(i)?' selected':'');b.dataset.i=i;b.textContent=face(id);b.style.background=chars[id].color;b.setAttribute('aria-label',chars[id].name);root.appendChild(b)})}
function update(){$('score').textContent=score.toLocaleString();$('time').textContent=time;$('combo').textContent=combo;$('skillbar').style.width=skill+'%';$('skilltext').textContent=skill>=100?'発動できるよ！':'あと '+(100-skill);$('skill').disabled=!running||skill<100||locked;$('cleared').textContent=cleared;$('missionbar').style.width=Math.min(100,cleared/30*100)+'%';$('best').textContent=best}
function renderCollection(){$('collection').innerHTML='';chars.forEach((c,i)=>{const el=document.createElement('div');el.className='char'+(unlocked.has(c.id)?'':' locked');el.innerHTML='<span>'+(unlocked.has(c.id)?c.face:'❔')+'</span><div>'+(unlocked.has(c.id)?c.name:'？？？')+'<br><small>'+(unlocked.has(c.id)?'なかま':'スコアで発見')+'</small></div>';$('collection').appendChild(el)})}
function start(){clearInterval(timer);score=0;time=60;combo=0;skill=0;cleared=0;running=true;locked=false;path=[];init();$('start').textContent='プレイ中…';$('start').disabled=true;timer=setInterval(()=>{if(!running)return;time--;update();if(time<=0)end()},1000);toast('スタート！ 同じまるをつなごう！')}
function end(){running=false;clearInterval(timer);$('start').disabled=false;$('start').textContent='もう一度プレイ';best=Math.max(best,score);localStorage.setItem('marutsumu-best',String(best));$('resulttitle').textContent='🎉 おつかれさま！';$('resulttext').textContent='スコア '+score.toLocaleString()+' 点！ まるを '+cleared+' 個消したよ。';$('overlay').style.display='grid';update()}
function neighbors(a,b){return Math.abs(a%N-b%N)<=1&&Math.abs(Math.floor(a/N)-Math.floor(b/N))<=1&&a!==b}
function startPath(i){if(!running||locked)return;dragging=true;path=[i];draw()}
function extend(i){if(!dragging||!running||locked||path.includes(i))return;const last=path[path.length-1];if(neighbors(last,i)&&board[i]===board[last]){path.push(i);draw()}}
function release(){if(!dragging)return;dragging=false;if(path.length>=3)clearPath();else{path=[];draw()}}
function clearPath(){const count=path.length,id=board[path[0]];if(count<3){path=[];draw();return}locked=true;const pts=count*count*10;score+=pts;combo++;cleared+=count;skill=Math.min(100,skill+count*5);if(score>=300)unlocked.add('g');if(score>=800)unlocked.add('v');if(score>=1600)unlocked.add('o');toast(count+'個消した！ +'+pts+'点');const indices=new Set(path);path=[];board=board.map((v,i)=>indices.has(i)?-1:v);draw();setTimeout(()=>{for(let c=0;c<N;c++){let vals=[];for(let r=N-1;r>=0;r--){let v=board[r*N+c];if(v>=0)vals.push(v)}for(let r=N-1;r>=0;r--)board[r*N+c]=vals[N-1-r]??rand();}locked=false;draw();renderCollection();update();if(cleared>=30)$('mission').textContent='ミッション達成！ おめでとう 🎊';if(running&&time>0&&combo>=5)toast('🔥 '+combo+'コンボ！');},260);update()}
function useSkill(){if(skill<100||!running||locked)return;skill=0;locked=true;const target=Math.floor(Math.random()*chars.length);let hits=0;board=board.map(v=>{if(v===target&&hits<10){hits++;return -1}return v});score+=hits*25;cleared+=hits;toast('✨ '+face(target)+'が '+hits+'個消えた！');draw();setTimeout(()=>{for(let c=0;c<N;c++){let vals=[];for(let r=N-1;r>=0;r--){let v=board[r*N+c];if(v>=0)vals.push(v)}for(let r=N-1;r>=0;r--)board[r*N+c]=vals[N-1-r]??rand()}locked=false;draw();update()},250);update()}
$('board').addEventListener('pointerdown',e=>{const b=e.target.closest('.orb');if(!b)return;e.preventDefault();$('board').setPointerCapture?.(e.pointerId);startPath(Number(b.dataset.i))});
$('board').addEventListener('pointermove',e=>{if(!dragging)return;const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.orb');if(el)extend(Number(el.dataset.i))});
$('board').addEventListener('pointerup',release);$('board').addEventListener('pointercancel',release);$('start').addEventListener('click',start);$('skill').addEventListener('click',useSkill);$('again').addEventListener('click',()=>{$('overlay').style.display='none';start()});
let toastTimer;function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1500)}
init();
})();</script></body></html>
