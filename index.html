<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10291d"><title>FOOTBALL DAYS｜選手育成サッカー</title>
<style>

ht:42px;font-weight:800;font-size:12px}.btn.gold{background:#edce69;color:#263922;border-color:#a79d4b}.btn.red{background:#7d3e36;border-color:#a55c4f}.btn.full{width:100%}.btn.small{min-height:32px;padding:6px 8px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #36563d}.row:last-child{border:0}.pill{font-size:10px;background:#355a3c;color:var(--mint);padding:4px 7px;border-radius:4px}.metric{background:#122a1b;border:1px solid #3e6040;padding:9px;border-radius:7px}.metric span{display:block;color:var(--muted);font-size:10px}.metric b{display:block;color:var(--gold);font-size:21px;margin:4px 0}.player{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #36563d}.avatar{width:34px;height:38px;display:grid;place-items:center;background:#e5cb6a;color:#263922;border-radius:5px;font-weight:1000}.ov{font-size:20px;color:var(--gold);font-weight:1000}.bar{height:6px;background:#0c2014;border-radius:8px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:#d9c86b}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,900px);display:grid;grid-template-columns:repeat(5,1fr);z-index:5;background:#0b1d13;border-top:2px solid #557d4e;padding:5px 4px calc(5px + env(safe-area-inset-bottom));gap:3px}.tabs button{border:0;background:transparent;color:#bbccb7;font-size:10px;padding:5px 0;border-radius:6px}.tabs button.active{background:#345a3c;color:var(--gold)}.tabs i{display:block;font-style:normal;font-size:17px;margin-bottom:2px}.pitchwrap{background:#286b3b;border:2px solid #c1d99c;border-radius:8px;overflow:hidden;position:relative}.pitch{display:block;width:100%;height:clamp(330px,66vw,500px);touch-action:none}.pitchhint{position:absolute;left:7px;right:7px;bottom:6px;display:flex;justify-content:space-between;pointer-events:none}.pitchhint span{background:#092015dd;padding:4px 6px;border-radius:4px;font-size:9px}.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}.log{background:#10271a;border-left:3px solid var(--gold);padding:8px;margin:6px 0;font-size:11px;line-height:1.5}.modalback{display:none;position:fixed;inset:0;z-index:10;background:#000b;align-items:flex-end;justify-content:center}.modalback.show{display:flex}.modal{background:#193524;border:1px solid #628359;border-radius:14px 14px 0 0;padding:14px;width:min(100%,700px);max-height:88dvh;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modalhead h2{font-size:17px;color:var(--gold);margin:0}.toast{position:fixed;z-index:12;left:50%;bottom:88px;transform:translateX(-50%);background:var(--gold);color:#1b301f;border-radius:7px;padding:10px 14px;font-weight:900;font-size:12px;display:none;max-width:92%;text-align:center}.toast.show{display:block}.field{width:100%;background:#10271a;border:1px solid #547552;color:white;border-radius:6px;padding:10px;margin:5px 0 9px}.score{display:flex;align-items:center;justify-content:center;gap:20px;font-size:25px;font-weight:1000;color:var(--gold)}@media(min-width:650px){.content{padding:18px}.pitch{height:480px}.modalback{align-items:center}.modal{border-radius:14px}.tabs{position:sticky;transform:none;left:auto;margin:auto}.app{padding-bottom:0}header{position:sticky}}
</style></head><body><main class="app"><header><div class="top"><div class="logo">FOOTBALL DAYS<small>PLAYER GROWTH × TACTICAL ACTION</small></div><div class="year" id="year">シーズン 1</div></div><div class="quick"><div class="q"><span>チーム総合力</span><b id="teamPower">--</b></div><div class="q"><span>所属選手</span><b id="count">--</b></div><div class="q"><span>スカウト資金</span><b id="cash">--</b></div></div></header><div id="content" class="content"></div><nav class="tabs"><button data-tab="home" class="active"><i>🏠</i>ホーム</button><button data-tab="team"><i>👥</i>選手</button><button data-tab="scout"><i>🔎</i>獲得</button><button data-tab="train"><i>⚡</i>育成</button><button data-tab="match"><i>⚽</i>試合</button></nav></main><div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h2 id="modaltitle">選手詳細</h2><button class="btn small" id="closeModal">閉じる ✕</button></div><div id="modalbody"></div></div></div><div id="toast" class="toast"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),content=$('content');const STORE='footballdays-save-v2',STORE2='football-days-career-v1';
const first=['蒼','悠','陽','蓮','大翔','湊','颯','陸','晴','翼','玲央','駿','海斗','拓真','一樹','直人','圭吾','翔','隼人','悠真','樹','光','龍之介','誠'];const last=['青葉','風間','桐生','星野','日向','森野','高原','水野','白石','黒田','早川','橘','大空','新田','小峰','秋月','藤堂','神谷','若林','立花','岸本','南','三浦','相沢','城戸'];const positions=['GK','DF','DF','DF','MF','MF','MF','FW','FW','DF','MF','FW'];let tab='home',match=null,selectedId=null,toastTimer;
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function newPlayer(pos='MF',base=52){let id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);let atk=rand(base-9,base+8),def=rand(base-10,base+8),speed=rand(base-8,base+10),pass=rand(base-9,base+9),shoot=rand(base-10,base+10),stamina=rand(base-8,base+9);let ov=Math.round((atk+def+speed+pass+shoot+stamina)/6);return{id,name:last[rand(0,last.length-1)]+first[rand(0,first.length-1)],pos,age:rand(17,27),ov,atk,def,speed,pass,shoot,stamina,level:1,exp:0,potential:rand(1,5),condition:rand(75,100),fatigue:rand(0,15),apps:0,goals:0,assists:0,tackles:0,passes:0,shots:0,skills:rand(0,2),special:rand(0,2),value:Math.round(150000+ov*12000),growth:0};}
function initial(){let players=positions.map((p,i)=>newPlayer(p,49+Math.floor(i/3)));return{version:1,club:'FOOTBALL DAYS FC',season:1,money:1500000,players,formation:'4-3-3',tactic:'balanced',wins:0,draws:0,losses:0,played:0,goalsFor:0,goalsAgainst:0,history:[],events:['新しいチームが始動！ 選手を育てて、試合で勝利をつかもう。'],scouts:[],lastResult:null,gameCount:0};}
function normalize(s){if(!s||!Array.isArray(s.players))return initial();s.players=s.players.map((p,i)=>{let ov=Number(p.ov||p.overall||48);return{id:p.id||'legacy'+i,name:p.name||'選手'+(i+1),pos:['GK','DF','MF','FW'].includes(p.pos)?p.pos:'MF',age:p.age||20,ov,atk:p.atk||ov,def:p.def||ov,speed:p.speed||ov,pass:p.pass||ov,shoot:p.shoot||ov,stamina:p.stamina||ov,level:p.level||1,exp:p.exp||0,potential:p.potential||3,condition:p.condition||p.morale||85,fatigue:p.fatigue||0,apps:p.apps||0,goals:p.goals||0,assists:p.assists||0,tackles:p.tackles||0,passes:p.passes||0,shots:p.shots||0,skills:p.skills||0,special:p.special||0,value:p.value||ov*12000,growth:p.growth||0};});return{...initial(),...s,players:s.players,version:1,history:s.history||[],events:s.events||[],scouts:s.scouts||[]};}
function load(){try{let raw=localStorage.getItem(STORE2)||localStorage.getItem(STORE);if(raw)return normalize(JSON.parse(raw));}catch(e){console.warn('Save migration failed',e)}return initial();}
let s=load();
function save(){try{localStorage.setItem(STORE2,JSON.stringify(s));localStorage.setItem(STORE,JSON.stringify(s));}catch(e){toast('保存できません。端末の空き容量を確認してください');}}
function toast(t){let el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
function power(){return Math.round(s.players.slice().sort((a,b)=>b.ov-a.ov).slice(0,11).reduce((a,p)=>a+p.ov,0)/Math.max(1,Math.min(11,s.players.length)));}
function money(n){return '¥'+Math.round(n).toLocaleString('ja-JP')}function note(t){s.events.unshift(t);s.events=s.events.slice(0,12)}
function player(id){return s.players.find(p=>p.id===id)}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function header(){ $('year').textContent='シーズン '+s.season+' · '+(s.played%12+1)+'節';$('teamPower').textContent=power();$('count').textContent=s.players.length+'人';$('cash').textContent=money(s.money);}
function show(title,html){$('modaltitle').textContent=title;$('modalbody').innerHTML=html;$('modalback').classList.add('show')}
function close(){ $('modalback').classList.remove('show');render();}
function button(label,action,cls='btn'){return '<button class="'+cls+'" data-action="'+action+'">'+label+'</button>'}
function home(){content.innerHTML='<section class="hero"><h1>選手を育て、試合を動かせ。</h1><p>選手を獲得し、個性を伸ばし、ピッチでは自分の指で選手を動かして勝利をつかむ。クラブ経営なし、サッカーの楽しさに集中しよう。</p></section><div class="grid2"><div class="metric"><span>チーム総合力</span><b>'+power()+'</b><small>先発候補11人の平均</small></div><div class="metric"><span>通算成績</span><b>'+s.wins+'勝 '+s.draws+'分 '+s.losses+'敗</b><small>'+s.goalsFor+'得点 / '+s.goalsAgainst+'失点</small></div></div><div class="title">すぐにプレイ</div><div class="grid2">'+button('⚽ 試合に挑戦','startMatch','btn gold full')+button('🔎 選手をスカウト','goScout','btn full')+button('⚡ トレーニング','goTrain','btn full')+button('👥 選手一覧','goTeam','btn full')+'</div><div class="title">最近の記録</div><div class="panel">'+(s.events.length?s.events.slice(0,5).map(e=>'<div class="log">'+esc(e)+'</div>').join(''):'<div class="muted">まだ記録はありません。</div>')+'</div><div class="panel"><div class="row"><span>フォーメーション</span><b>'+s.formation+'</b></div><div class="row"><span>チーム戦術</span><b>'+({'balanced':'バランス','attack':'攻撃重視','press':'前線プレス','counter':'カウンター'}[s.tactic]||s.tactic)+'</b></div>'+button('戦術・フォーメーション設定','settings','btn full')+'<div class="muted" style="margin-top:8px">セーブは自動保存されます。旧バージョンの選手データも可能な範囲で引き継ぎます。</div></div>';}
function playerCard(p){return '<div class="player"><div class="avatar">'+esc(p.pos)+'</div><div><b>'+esc(p.name)+'</b> <span class="pill">'+p.pos+'</span><div class="muted">Lv.'+p.level+' · '+p.age+'歳 · 経験値 '+p.exp+'/100 · コンディション '+p.condition+'%</div><div class="bar"><i style="width:'+p.condition+'%"></i></div><div class="muted">⚽ '+p.goals+'得点 · 🎯 '+p.assists+'アシスト · 出場 '+p.apps+'</div></div><div style="text-align:right"><div class="ov">'+p.ov+'</div>'+button('詳細','player:'+p.id,'btn small')+'</div></div>'}
function team(){content.innerHTML='<div class="title">選手一覧 <span class="pill">'+s.players.length+'人登録</span></div><div class="panel"><div class="grid3"><div class="metric"><span>GK</span><b>'+s.players.filter(p=>p.pos==='GK').length+'</b></div><div class="metric"><span>DF</span><b>'+s.players.filter(p=>p.pos==='DF').length+'</b></div><div class="metric"><span>MF / FW</span><b>'+s.players.filter(p=>['MF','FW'].includes(p.pos)).length+'</b></div></div><div class="muted" style="margin-top:8px">選手カードの詳細から能力・成績を確認できます。試合・育成・獲得画面も同じ選手データを参照します。</div></div><div class="panel">'+s.players.slice().sort((a,b)=>b.ov-a.ov).map(playerCard).join('')+'</div><div class="title">チーム設定</div><div class="panel"><label>フォーメーション</label><select id="formation" class="field">'+['4-3-3','4-4-2','3-5-2','4-2-3-1','3-4-3'].map(x=>'<option '+(s.formation===x?'selected':'')+'>'+x+'</option>').join('')+'</select><label>戦術</label><select id="tactic" class="field"><option value="balanced" '+(s.tactic==='balanced'?'selected':'')+'>バランス</option><option value="attack" '+(s.tactic==='attack'?'selected':'')+'>攻撃重視</option><option value="press" '+(s.tactic==='press'?'selected':'')+'>前線プレス</option><option value="counter" '+(s.tactic==='counter'?'selected':'')+'>カウンター</option></select>'+button('設定を保存','saveSettings','btn gold full')+'</div>'}
function scout(){if(!s.scouts.length)s.scouts=Array.from({length:4},()=>newPlayer(['GK','DF','MF','FW'][rand(0,3)],rand(48,76)));content.innerHTML='<div class="title">スカウト候補</div><div class="panel"><h3>新戦力を見つけよう</h3><div class="muted">候補は能力・ポジション・成長ポテンシャルで比較。獲得費用は選手の能力に応じて変わります。クラブ経営やスポンサー契約はありません。</div>'+button('候補を再調査（¥30,000）','refreshScout','btn full')+'</div><div class="panel">'+s.scouts.map(p=>'<div class="player"><div class="avatar">'+p.pos+'</div><div><b>'+esc(p.name)+'</b><div class="muted">'+p.age+'歳 · '+p.pos+' · 成長ポテンシャル '+('★'.repeat(p.potential))+'</div><div class="muted">攻 '+p.atk+' / 守 '+p.def+' / 速 '+p.speed+' / パス '+p.pass+' / シュート '+p.shoot+'</div></div><div style="text-align:right"><div class="ov">'+p.ov+'</div><div class="muted">'+money(p.value)+'</div>'+button('獲得','sign:'+p.id,'btn small '+(s.money<p.value?'red':''))+'</div></div>').join('')+'</div><div class="panel"><div class="row"><span>登録枠</span><b>'+s.players.length+'人</b></div><div class="muted">ポジションの偏りも確認して獲得しよう。加入した選手はそのまま試合メンバーに反映されます。</div></div>'}
function train(){content.innerHTML='<div class="title">選手育成</div><div class="panel"><h3>練習メニュー</h3><div class="muted">トレーニングで能力・経験値が上昇し、疲労も蓄積します。試合出場でも経験値を獲得します。</div></div><div class="grid2">'+[['all','総合練習','全能力を少し伸ばす'],['shoot','シュート特訓','攻撃・シュート力を伸ばす'],['pass','パス特訓','パス・判断力を伸ばす'],['def','守備特訓','守備力・フィジカルを伸ばす'],['speed','ドリブル・スピード','スピードと攻撃力を伸ばす'],['rest','休養','疲労を回復し調子を整える']].map(x=>'<div class="panel"><h3>'+x[1]+'</h3><div class="muted">'+x[2]+'</div>'+button('実施する','train:'+x[0],'btn full')+'</div>').join('')+'</div><div class="title">個別育成</div><div class="panel"><label>育成する選手</label><select id="trainee" class="field">'+s.players.slice().sort((a,b)=>b.ov-a.ov).map(p=>'<option value="'+p.id+'">'+esc(p.name)+' · '+p.pos+' · OVR '+p.ov+'</option>').join('')+'</select>'+button('選手を重点育成（¥15,000）','individualTrain','btn gold full')+'</div><div class="title">成長を確認</div><div class="panel">'+s.players.slice().sort((a,b)=>b.exp-a.exp).slice(0,5).map(p=>'<div class="row"><span>'+esc(p.name)+' <small class="muted">Lv.'+p.level+'</small></span><span>'+p.exp+'/100 XP<div class="bar"><i style="width:'+p.exp+'%"></i></div></span></div>').join('')+'</div>'}

function drawPitch(){let c=$('pitch');if(!c||!match)return;let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);let g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);let w=r.width,h=r.height;g.fillStyle='#2b8044';g.fillRect(0,0,w,h);for(let i=0;i<8;i++){g.fillStyle=i%2?'#32884a':'#2b8044';g.fillRect(i*w/8,0,w/8,h)}g.strokeStyle='#d6edc4';g.lineWidth=1.5;g.strokeRect(8,8,w-16,h-16);g.beginPath();g.moveTo(w/2,8);g.lineTo(w/2,h-8);g.stroke();g.beginPath();g.arc(w/2,h/2,Math.min(w,h)*.13,0,Math.PI*2);g.stroke();g.strokeRect(8,h*.28,w*.15,h*.44);g.strokeRect(w-8-w*.15,h*.28,w*.15,h*.44);g.fillStyle='#f8e07b';g.beginPath();g.arc(match.ball.x*w,match.ball.y*h,5,0,Math.PI*2);g.fill();for(let team of ['enemy','our'])for(let i=0;i<match[team].length;i++){let p=match[team][i],x=p.x*w,y=p.y*h,sel=team==='our'&&i===match.selected;g.fillStyle=team==='our'?'#71e0cf':'#ff9586';g.beginPath();g.arc(x,y,sel?12:9,0,Math.PI*2);g.fill();if(sel){g.strokeStyle='#fff2a8';g.lineWidth=3;g.beginPath();g.arc(x,y,15,0,Math.PI*2);g.stroke()}g.fillStyle='#10251a';g.font='bold 9px sans-serif';g.textAlign='center';g.fillText(team==='our'?String(i+1):'×',x,y+3);if(p.id===match.ball.owner){g.fillStyle='#ffe58a';g.beginPath();g.arc(x+10,y-10,4,0,Math.PI*2);g.fill()}}}

function bindPitch(){let c=$('pitch');if(!c||c.dataset.bound)return;c.dataset.bound='1';let dragging=null;c.addEventListener('pointerdown',e=>{if(!match||match.done)return;e.preventDefault();let pt=getCanvasPoint(e),best=Infinity,idx=-1;match.our.forEach((p,i)=>{let dist=Math.hypot(p.x-pt.x,p.y-pt.y);if(dist<best){best=dist;idx=i}});if(best<.1){match.selected=idx;dragging=idx;c.setPointerCapture(e.pointerId);drawPitch();$('selectedName').textContent=match.our[idx].name;}else{match.ball.x=pt.x;match.ball.y=pt.y} });c.addEventListener('pointermove',e=>{if(dragging===null||!match)return;e.preventDefault();let pt=getCanvasPoint(e),p=match.our[dragging];let cost=Math.hypot(pt.x-p.x,pt.y-p.y);p.x=pt.x;p.y=pt.y;if(match.ball.owner===p.id){match.ball.x=p.x;match.ball.y=p.y}if(cost>.005)drawPitch()});const end=()=>{if(dragging!==null&&match){log(match.our[dragging].name+'がポジションを変更。次の行動を選ぼう。');dragging=null;save();drawPitch()}};c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end)}
function action(a){if(!match||match.done)return;let m=match,p=current(),owner=holder(),enemyNear=m.enemy.reduce((best,e)=>Math.min(best,Math.hypot(e.x-p.x,e.y-p.y)),1);let stamina=Math.max(0,p.stamina-p.fatigue),attacking=m.ball.owner===p.id||m.ball.owner===null&&m.ball.x>.5;if(['パス','ドリブル','シュート','スルーパス','センタリング','必殺シュート'].includes(a)&&m.ball.owner!==p.id){if(owner&&owner.team==='our'){log('ボールは'+owner.name+'が保持中。保持者を選択するか、守備行動を選ぼう。');toast('ボール保持者を選んでください');return}if(a!=='タックル'&&a!=='プレス'&&a!=='必殺ブロック'){log('まずは味方のボールを奪い返そう！');return}}

function turnover(t){log(t);let e=match.enemy[rand(0,match.enemy.length-1)];match.ball.owner=e.id;match.ball.x=e.x;match.ball.y=e.y;match.our.forEach(p=>p.hasBall=false)}

function actTraining(type,list=s.players){if(type==='rest'){list.forEach(p=>{p.fatigue=Math.max(0,p.fatigue-24);p.condition=Math.min(100,p.condition+10)});note('休養を実施。疲労が回復した。');toast('コンディションが回復！');save();render();return}list.forEach(p=>{let amt=rand(1,2)+(p.potential>=4?1:0);let stat=type==='all'?['atk','def','speed','pass','shoot','stamina'][rand(0,5)]:type==='shoot'?'shoot':type==='pass'?'pass':type==='def'?'def':type==='speed'?'speed':'atk';p[stat]=Math.min(99,p[stat]+amt);p.exp+=rand(8,17);p.fatigue=Math.min(90,p.fatigue+rand(5,10));p.ov=Math.round((p.atk+p.def+p.speed+p.pass+p.shoot+p.stamina)/6);while(p.exp>=100){p.exp-=100;p.level++;p.ov=Math.min(99,p.ov+1);note(p.name+'がレベルアップ！')}});note(({all:'総合練習',shoot:'シュート特訓',pass:'パス特訓',def:'守備特訓',speed:'ドリブル・スピード'}[type]||'練習')+'を実施。能力が成長した。');save();render();toast('練習完了！ 成長を確認しよう');}
function settings(){show('チーム設定','<label>チーム名</label><input id="clubinput" class="field" maxlength="24" value="'+esc(s.club)+'"><label>フォーメーション</label><select id="formationModal" class="field">'+['4-3-3','4-4-2','3-5-2','4-2-3-1','3-4-3'].map(x=>'<option '+(s.formation===x?'selected':'')+'>'+x+'</option>').join('')+'</select><label>チーム戦術</label><select id="tacticModal" class="field"><option value="balanced">バランス</option><option value="attack">攻撃重視</option><option value="press">前線プレス</option><option value="counter">カウンター</option></select>'+button('保存','saveModalSettings','btn gold full')+'<div class="title">セーブデータ</div>'+button('今すぐ保存','saveGame','btn full')+' '+button('データを初期化','resetGame','btn red full')+'<div class="muted">初期化は確認後に実行されます。</div>');$('tacticModal').value=s.tactic;}
function playerDetail(id){let p=player(id);if(!p)return;show(p.name,'<div class="grid2"><div class="metric"><span>総合能力</span><b>'+p.ov+'</b></div><div class="metric"><span>ポテンシャル</span><b>'+('★'.repeat(p.potential))+'</b></div></div><div class="row"><span>ポジション / 年齢</span><b>'+p.pos+' / '+p.age+'歳</b></div><div class="row"><span>レベル / 経験値</span><b>Lv.'+p.level+' · '+p.exp+'/100</b></div><div class="title">個別能力</div>'+[['攻撃','atk'],['守備','def'],['スピード','speed'],['パス','pass'],['シュート','shoot'],['スタミナ','stamina']].map(([n,k])=>'<div class="row"><span>'+n+'</span><b>'+p[k]+'</b></div>').join('')+'<div class="title">キャリア成績</div><div class="grid3"><div class="metric"><span>出場</span><b>'+p.apps+'</b></div><div class="metric"><span>得点</span><b>'+p.goals+'</b></div><div class="metric"><span>アシスト</span><b>'+p.assists+'</b></div></div><div class="row"><span>コンディション</span><b>'+p.condition+'%</b></div><div class="row"><span>疲労</span><b>'+p.fatigue+'%</b></div>');}
function render(){header();if(tab==='home')home();if(tab==='team')team();if(tab==='scout')scout();if(tab==='train')train();if(tab==='match')matchTab();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));save();}
document.addEventListener('click',e=>{let t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();return}let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;if(a.startsWith('player:'))return playerDetail(a.slice(7));if(a.startsWith('act:'))return action(a.slice(4));if(a.startsWith('train:'))return actTraining(a.slice(6));if(a.startsWith('sign:')){let id=a.slice(5),p=s.scouts.find(x=>x.id===id);if(!p)return;if(s.money<p.value){toast('獲得資金が足りません');return}if(s.players.length>=30){toast('登録上限30人です');return}s.money-=p.value;s.players.push(p);s.scouts=s.scouts.filter(x=>x.id!==id);note(p.name+'がチームに加入！');save();render();toast('選手を獲得しました');return}if(a==='goTeam'){tab='team';render()}else if(a==='goScout'){tab='scout';render()}else if(a==='goTrain'){tab='train';render()}else if(a==='startMatch')startMatch();else if(a==='nextTurn')nextTurn();else if(a==='endMatch'){match=null;tab='home';render()}else if(a==='rematch')startMatch();else if(a==='settings')settings();else if(a==='refreshScout'){if(s.money<30000){toast('資金が足りません');return}s.money-=30000;s.scouts=Array.from({length:4},()=>newPlayer(['GK','DF','MF','FW'][rand(0,3)],rand(48,78)));save();render();toast('新しい候補が見つかりました')}else if(a==='individualTrain'){let p=player($('trainee').value);if(!p)return;if(s.money<15000){toast('資金が足りません');return}s.money-=15000;actTraining('all',[p])}else if(a==='saveSettings'){s.formation=$('formation').value;s.tactic=$('tactic').value;save();render();toast('設定を保存しました')}else if(a==='saveModalSettings'){s.club=$('clubinput').value.trim()||'FOOTBALL DAYS FC';s.formation=$('formationModal').value;s.tactic=$('tacticModal').value;save();close();toast('設定を保存しました')}else if(a==='saveGame'){save();toast('保存しました')}else if(a==='resetGame'){if(confirm('選手・成績・セーブデータをすべて初期化します。よろしいですか？')){localStorage.removeItem(STORE);localStorage.removeItem(STORE2);s=initial();match=null;close();toast('初期化しました')}}});
$('closeModal').addEventListener('click',()=>close());$('modalback').addEventListener('click',e=>{if(e.target===$('modalback'))close()});window.addEventListener('resize',()=>{if(match&&tab==='match'&&!match.done)drawPitch()});window.addEventListener('beforeunload',save);
render();
})();</script></body></html>
