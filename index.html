<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>EMBERKEEP — 灰燼の塔</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f2f4fb;font:14px system-ui,-apple-system,sans-serif}button{border:1px solid #58627c;background:#252e45;color:#fff;border-radius:12px;padding:12px;font-weight:800;touch-action:manipulation}button:active{transform:scale(.97);background:#414d6c}.wrap{max-width:980px;margin:auto;padding:12px;display:grid;gap:10px}.head,.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:clamp(20px,5vw,30px);font-weight:1000;letter-spacing:1px}.muted{color:#aab4ca;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat,.panel{background:#171f33;border:1px solid #303b57;border-radius:13px;padding:10px}.stat small{display:block;color:#aab4ca}.stat b{font-size:17px}.red{color:#ff8d94}.gold{color:#ffd37e}.green{color:#92efbb}.stage{position:relative;border:1px solid #4c526d;border-radius:14px;overflow:hidden;background:#171a2b}canvas{display:block;width:100%;aspect-ratio:3/2;touch-action:none}.msg{position:absolute;left:50%;top:9px;transform:translateX(-50%);padding:8px 13px;background:#0b1020e8;border:1px solid #a8a1bd;border-radius:20px;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}.layout{display:grid;gap:9px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.pad button{font-size:19px;min-height:43px;padding:5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:5px}.actions button{min-height:43px}.panel h3{margin:0 0 8px;color:#ffd37e;font-size:14px}.log{height:88px;overflow:auto;font-size:12px;line-height:1.6;color:#d0d8e9}.progress{height:7px;background:#333b51;border-radius:8px;overflow:hidden;margin-top:5px}.progress i{display:block;height:100%;width:100%;background:#ef7e71}.quest{line-height:1.8;font-size:12px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#080b16ed;z-index:5;display:grid;place-items:center;padding:18px}.card{width:min(440px,100%);padding:24px;background:#171f33;border:1px solid #6d6680;border-radius:20px;text-align:center}.card h1{font-size:28px;margin:6px}.card p{line-height:1.7;color:#c2cadd}.card button{width:100%;margin-top:8px;background:#653c4c}.footer{display:flex;gap:8px}.footer button{flex:1}@media(min-width:760px){.layout{grid-template-columns:1fr 260px;align-items:start}.side{display:grid;gap:9px}}@media(max-width:420px){.wrap{padding:7px;gap:7px}.stat{padding:7px}.stat b{font-size:15px}.controls{gap:5px}.panel{padding:9px}}
</style></head><body><main class="wrap">
<header class="head"><div><div class="brand">🔥 EMBERKEEP</div><div class="muted">灰燼の塔 — 小さなローグライク冒険</div></div><button id="save">保存</button></header>
<section class="stats"><div class="stat"><small>生命力</small><b class="red" id="hp">100 / 100</b><div class="progress"><i id="hpbar"></i></div></div><div class="stat"><small>階層</small><b id="floor">01 F</b></div><div class="stat"><small>経験値</small><b id="xp">0 / 20</b></div><div class="stat"><small>魂片</small><b class="gold" id="souls">0</b></div></section>
<div class="layout"><div><div class="stage"><canvas id="field" width="900" height="600"></canvas><div class="msg" id="msg">冒険を始めよう</div></div><div class="controls"><div class="pad"><span></span><button data-move="0,-1">▲</button><span></span><button data-move="-1,0">◀</button><button data-move="0,0">●</button><button data-move="1,0">▶</button><span></span><button data-move="0,1">▼</button><span></span></div><div class="actions"><button id="hit">⚔️ 攻撃</button><button id="drink">🧪 薬草</button><button id="use">🚪 調べる</button><button id="wait">🛡️ 防御</button></div></div></div>
<aside class="side"><section class="panel"><h3>今回の目標</h3><div class="quest" id="objective">塔の番人を倒して次の階へ進め。</div></section><section class="panel"><h3>冒険の記録</h3><div class="log" id="log">灰の降る塔で目を覚ました……</div></section><section class="panel"><h3>旅人の状態</h3><div id="inventory" class="quest">鉄の短剣 · 薬草 3個</div><p class="muted">移動：方向ボタン / WASD・矢印<br>攻撃：攻撃ボタン / Space<br>回復：薬草 / Q　調べる：E</p></section></aside></div>
<div class="footer"><button id="restart">新しい冒険</button><button id="pause">一時停止</button></div><div class="muted">自動保存はこのゲーム専用の保存領域を使用します。</div></main>
<div class="modal" id="intro"><div class="card"><div style="font-size:48px">🔥 🗝️</div><h1>EMBERKEEP</h1><p>灰に沈んだ塔を登り、番人を倒して最上階を目指そう。部屋ごとに敵と戦い、魂片を集め、薬草を使って生き残れ。</p><button id="start">新しい冒険を始める</button><button id="resume">保存データから再開</button></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),cv=$('field'),g=cv.getContext('2d');const W=15,H=10,T=60;
const STORE='emberkeep_save_v1';let game,held={x:0,y:0},keys={},paused=true,raf=0,last=0,msgTimer=0;
const say=t=>{$('msg').textContent=t;$('msg').classList.remove('hidden');clearTimeout(msgTimer);msgTimer=setTimeout(()=>$('msg').classList.add('hidden'),1700)};
const rand=n=>Math.floor(Math.random()*n);
function fresh(){let s={floor:1,turn:0,player:{x:2,y:2,hp:100,maxHp:100,atk:18,xp:0,need:20,level:1,potions:3,souls:0,guard:false},enemies:[],items:[],map:[],stairs:{x:12,y:7},over:false,won:false};makeRoom(s);return s}
function makeRoom(s){s.map=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>x===0||y===0||x===W-1||y===H-1?1:0));s.map[s.player.y][s.player.x]=0;for(let i=0;i<7;i++){let x=2+rand(11),y=2+rand(6);if(!(x===s.player.x&&y===s.player.y))s.map[y][x]=1;}s.enemies=[];let count=Math.min(2+s.floor,8);for(let i=0;i<count;i++){let p=emptySpot(s);s.enemies.push({x:p.x,y:p.y,hp:22+s.floor*9,max:22+s.floor*9,atk:6+s.floor*2,xp:8+s.floor*2,boss:s.floor%5===0&&i===0,wait:0})}s.items=[];for(let i=0;i<2;i++){let p=emptySpot(s);s.items.push({...p,type:'herb'})}let p=emptySpot(s);s.stairs=p;s.map[p.y][p.x]=2;s.turn=0}
function emptySpot(s){for(let i=0;i<500;i++){let x=1+rand(W-2),y=1+rand(H-2);if(s.map[y][x]===0&&!(s.player.x===x&&s.player.y===y)&&!s.enemies.some(e=>e.x===x&&e.y===y)&&!(s.stairs&&s.stairs.x===x&&s.stairs.y===y))return{x,y}}return{x:W-2,y:H-2}}
function log(t){let el=$('log');el.innerHTML=t+'<br>'+el.innerHTML.split('<br>').slice(0,5).join('<br>')}
function move(dx,dy){if(paused||game.over)return;let x=game.player.x+dx,y=game.player.y+dy;if(!game.map[y]||(game.map[y][x]!==0&&game.map[y][x]!==2)){say('道がふさがっている');return}if(game.enemies.some(e=>e.x===x&&e.y===y)){say('敵がいる！攻撃しよう');return}game.player.x=x;game.player.y=y;game.player.guard=false;game.turn++;const it=game.items.findIndex(i=>i.x===x&&i.y===y);if(it>=0){game.player.potions++;game.items.splice(it,1);say('薬草を拾った');log('薬草を手に入れた。')}enemyTurn();check();render()}
function attack(){if(paused||game.over)return;const p=game.player;let e=game.enemies.filter(e=>Math.abs(e.x-p.x)+Math.abs(e.y-p.y)===1).sort((a,b)=>a.hp-b.hp)[0];if(!e){say('隣に敵がいない');return}e.hp-=p.atk;say('敵に '+p.atk+' ダメージ！');log('敵に攻撃。');if(e.hp<=0){game.enemies=game.enemies.filter(a=>a!==e);p.souls+=5+game.floor;p.xp+=e.xp;log('敵を倒した。魂片と経験値を獲得。');while(p.xp>=p.need){p.xp-=p.need;p.level++;p.need=Math.floor(p.need*1.4);p.maxHp+=15;p.hp=p.maxHp;p.atk+=4;say('レベルアップ！ 攻撃力が上がった');}}game.turn++;enemyTurn();check();render()}
function enemyTurn(){const p=game.player;for(const e of game.enemies){if(e.wait>0){e.wait--;continue}const dx=p.x-e.x,dy=p.y-e.y,d=Math.abs(dx)+Math.abs(dy);if(d===1){let damage=Math.max(1,e.atk-(p.guard?Math.ceil(e.atk*.75):0));p.hp=Math.max(0,p.hp-damage);e.wait=1;say('敵の攻撃！ '+damage+' ダメージ');p.guard=false;continue}let opts=Math.abs(dx)>Math.abs(dy)?[[Math.sign(dx),0],[0,Math.sign(dy)]]:[[0,Math.sign(dy)],[Math.sign(dx),0]];for(const [mx,my] of opts){let nx=e.x+mx,ny=e.y+my;if(s.map[ny]?.[nx]===0&&!s.enemies.some(o=>o!==e&&o.x===nx&&o.y===ny)&&!(p.x===nx&&p.y===ny)){e.x=nx;e.y=ny;break}}}}
function check(){if(game.player.hp<=0){game.over=true;paused=true;say('倒れてしまった……');$('intro').classList.remove('hidden');$('intro').querySelector('h1').textContent='冒険はここで終わった';$('intro').querySelector('p').textContent='新しい冒険を始めるか、保存データから再開できます。';return}if(game.player.x===game.stairs.x&&game.player.y===game.stairs.y){game.floor++;game.player.hp=Math.min(game.player.maxHp,game.player.hp+12);if(game.floor>10){game.won=true;game.over=true;paused=true;$('intro').classList.remove('hidden');$('intro').querySelector('h1').textContent='塔を踏破した！';$('intro').querySelector('p').textContent='灰燼の塔の最上階に到達した。新しい冒険で記録を更新しよう。';log('塔を踏破した！');return}game.player.x=2;game.player.y=2;makeRoom(game);say('階層 '+game.floor+' F に到達');log('階層 '+game.floor+' F へ進んだ。')}}
function use(){if(paused||game.over)return;let p=game.player;if(p.x===game.stairs.x&&p.y===game.stairs.y){check();render();return}let item=game.items.find(i=>Math.abs(i.x-p.x)+Math.abs(i.y-p.y)<=1);if(item){p.potions++;game.items=game.items.filter(i=>i!==item);say('薬草を拾った');render();return}say('階段は黄色のタイル。敵を避けて向かおう')}
function drink(){if(paused||game.over)return;let p=game.player;if(p.potions<=0){say('薬草がない');return}if(p.hp===p.maxHp){say('体力は満タン');return}p.potions--;let heal=Math.min(35,p.maxHp-p.hp);p.hp+=heal;say('HPを '+heal+' 回復');game.turn++;enemyTurn();check();render()}
function guard(){if(paused||game.over)return;game.player.guard=true;say('防御態勢！次の攻撃を軽減');game.turn++;enemyTurn();check();render()}
function render(){g.clearRect(0,0,cv.width,cv.height);g.fillStyle='#171a2b';g.fillRect(0,0,900,600);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let t=game.map[y][x],px=x*T,py=y*T;g.fillStyle=t===1?'#34364a':'#252a3d';g.fillRect(px+1,py+1,T-2,T-2);if(t===1){g.fillStyle='#48465a';g.fillRect(px+5,py+5,T-10,T-10)}if(t===2){g.fillStyle='#f4c96d';g.fillRect(px+10,py+10,T-20,T-20);g.fillStyle='#573d40';g.font='28px system-ui';g.fillText('⇧',px+15,py+39)}}for(const i of game.items){g.fillStyle='#9ce8a8';g.beginPath();g.arc(i.x*T+30,i.y*T+30,11,0,7);g.fill();g.fillStyle='#172438';g.font='17px system-ui';g.fillText('+',i.x*T+24,i.y*T+36)}for(const e of game.enemies){g.fillStyle=e.boss?'#d78dff':'#ef817e';g.beginPath();g.arc(e.x*T+30,e.y*T+30,e.boss?22:17,0,7);g.fill();g.fillStyle='#171a2b';g.fillRect(e.x*T+18,e.y*T+24,5,5);g.fillRect(e.x*T+36,e.y*T+24,5,5);g.fillStyle='#1a1724';g.fillRect(e.x*T+8,e.y*T+5,44,5);g.fillStyle='#ff5f71';g.fillRect(e.x*T+8,e.y*T+5,44*Math.max(0,e.hp/e.max),5)}let p=game.player;g.fillStyle='#ffe6a0';g.beginPath();g.arc(p.x*T+30,p.y*T+30,17,0,7);g.fill();g.fillStyle='#282238';g.fillRect(p.x*T+22,p.y*T+25,4,5);g.fillRect(p.x*T+34,p.y*T+25,4,5);$('hp').textContent=p.hp+' / '+p.maxHp;$('hpbar').style.width=p.hp/p.maxHp*100+'%';$('floor').textContent=String(game.floor).padStart(2,'0')+' F';$('xp').textContent=p.xp+' / '+p.need;$('souls').textContent=p.souls;$('inventory').textContent='鉄の短剣（攻撃 '+p.atk+'） · 薬草 '+p.potions+'個 · Lv.'+p.level;$('objective').textContent=game.floor%5===0?'強敵を倒し、黄色い階段を探せ。':'敵を倒し、黄色い階段から次の階へ進め。';}
function save(){try{localStorage.setItem(STORE,JSON.stringify({version:1,game}));say('冒険を保存した');log('冒険を保存した。')}catch(e){say('保存できませんでした')}}
function load(){try{let raw=localStorage.getItem(STORE),v=JSON.parse(raw);if(v?.version!==1||!v.game?.player||!Array.isArray(v.game.map)||!Array.isArray(v.game.enemies))throw 0;game=v.game;paused=false;$('intro').classList.add('hidden');last=performance.now();loopStart();render();say('冒険を再開した')}catch(e){say('このゲームの保存データがありません')}}
function loopStart(){cancelAnimationFrame(raf);last=performance.now();const frame=now=>{if(!paused){let dt=Math.min(.05,(now-last)/1000);last=now;let x=held.x,y=held.y;if(keys.w||keys.arrowup)y=-1;if(keys.s||keys.arrowdown)y=1;if(keys.a||keys.arrowleft)x=-1;if(keys.d||keys.arrowright)x=1;if(x||y){let step=game._step||0;game._step=step+dt;if(game._step>.14){game._step=0;move(x,y)}}raf=requestAnimationFrame(frame)}};raf=requestAnimationFrame(frame)}
function start(){game=fresh();paused=false;game._step=0;$('intro').classList.add('hidden');$('intro').querySelector('h1').textContent='EMBERKEEP';$('intro').querySelector('p').textContent='灰に沈んだ塔を登り、番人を倒して最上階を目指そう。';log('冒険が始まった。');render();loopStart()}
$('start').onclick=start;$('resume').onclick=load;$('save').onclick=save;$('restart').onclick=()=>{$('intro').classList.remove('hidden');$('intro').querySelector('h1').textContent='EMBERKEEP';$('intro').querySelector('p').textContent='灰に沈んだ塔を登り、番人を倒して最上階を目指そう。'};$('hit').onclick=attack;$('drink').onclick=drink;$('use').onclick=use;$('wait').onclick=guard;$('pause').onclick=()=>{paused=!paused;if(!paused)loopStart();say(paused?'一時停止':'冒険再開')};
document.querySelectorAll('[data-move]').forEach(b=>{let [x,y]=b.dataset.move.split(',').map(Number);const on=e=>{e.preventDefault();held={x,y}};const off=()=>held={x:0,y:0};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave','lostpointercapture'].forEach(ev=>b.addEventListener(ev,off))});
addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if(k===' '){e.preventDefault();attack()}if(k==='e')use();if(k==='q')drink()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused){paused=true;cancelAnimationFrame(raf);say('画面を離れたため一時停止')}});game=fresh();render();
})();
</script></body></html>
