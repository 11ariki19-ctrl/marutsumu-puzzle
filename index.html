<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10251d"><title>クラブストーリー：FOOTBALL DAYS</title>
<style>
:root{--bg:#101f19;--panel:#1b3025;--panel2:#263d2e;--line:#3d5b43;--gold:#f1cc76;--mint:#a2e4b4;--muted:#b4c4b5;--red:#ff9a87}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f3e8;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.35;cursor:default}.app{max-width:900px;margin:auto;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}header{padding:10px 12px;background:#17291f;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}.brand{font-size:15px;font-weight:950;letter-spacing:.09em}.brand small{display:block;font-size:9px;color:var(--mint);letter-spacing:.16em}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:9px}.stat{background:#253a2c;border:1px solid #3b5640;border-radius:9px;padding:6px 7px}.stat span{display:block;font-size:9px;color:var(--muted)}.stat b{font-size:12px;color:var(--gold)}.hero{padding:12px;background:linear-gradient(135deg,#203c2c,#152b21)}.heroTop{display:flex;justify-content:space-between;gap:8px;align-items:start}.clubname{font-size:20px;font-weight:950}.sub{font-size:11px;color:var(--muted);margin-top:3px}.badge{border:1px solid #66816a;color:var(--mint);padding:5px 8px;border-radius:20px;font-size:10px;white-space:nowrap}.pitch{margin-top:10px;border-radius:12px;overflow:hidden;border:1px solid #53775a;background:#34794b;height:180px;position:relative}.pitch canvas{width:100%;height:100%;display:block}.pitchLabel{position:absolute;top:8px;left:9px;font-size:10px;background:#10251dcc;padding:5px 7px;border-radius:7px}.section{padding:12px}.sectionTitle{font-size:14px;font-weight:900;margin:0 0 9px;display:flex;justify-content:space-between;align-items:center}.muted{font-size:11px;color:var(--muted);font-weight:500}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px}.card h3{font-size:12px;margin:0 0 7px}.big{font-size:22px;font-weight:950;color:var(--gold)}.desc{font-size:11px;color:var(--muted);line-height:1.5;margin:5px 0 9px}.btn{border:1px solid #4b6a50;background:var(--panel2);color:#f7f3e8;border-radius:9px;padding:9px 10px;font-size:12px;font-weight:800;min-height:38px}.btn.gold{background:var(--gold);color:#1c2b20;border-color:#f7d995}.btn.green{background:#2f6240;border-color:#4d8b5c}.btn.full{width:100%}.btnrow{display:flex;gap:6px;flex-wrap:wrap}.tabs{position:sticky;bottom:0;z-index:2;display:grid;grid-template-columns:repeat(5,1fr);background:#13251c;border-top:1px solid var(--line);padding:6px 5px calc(6px + env(safe-area-inset-bottom));gap:3px}.tabs button{border:0;background:transparent;color:#aebfaf;border-radius:9px;padding:6px 0;font-size:10px}.tabs button.active{background:#2b4934;color:var(--mint)}.tabs i{font-style:normal;display:block;font-size:17px;margin-bottom:3px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #304737;font-size:12px}.row:last-child{border-bottom:0}.row small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.rating{font-weight:950;color:var(--gold);font-size:16px}.pill{font-size:10px;background:#304b37;padding:4px 7px;border-radius:20px;color:var(--mint)}.bar{height:6px;border-radius:6px;background:#34483a;overflow:hidden;margin-top:5px}.bar span{display:block;height:100%;background:#8ed5a0}.log{font-size:11px;line-height:1.7;color:#c5d2c5;padding:9px;background:#182a20;border-radius:9px;margin-top:7px}.empty{text-align:center;color:var(--muted);padding:22px;font-size:12px}.overlay{position:fixed;inset:0;background:#06130dcc;z-index:5;display:none;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.modal{width:100%;max-width:900px;max-height:85dvh;overflow:auto;background:#192d21;border:1px solid var(--line);border-radius:18px 18px 0 0;padding:15px 13px calc(18px + env(safe-area-inset-bottom))}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modalHead h2{font-size:17px;margin:0}.player{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #304737}.shirt{width:34px;height:38px;border-radius:8px;background:#d4b45e;color:#203024;display:grid;place-items:center;font-weight:950}.player strong{font-size:12px}.player small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.money{color:var(--gold);font-weight:900}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#e8d08a;color:#1a2c20;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:800;z-index:10;display:none;max-width:90%;text-align:center}.toast.show{display:block}@media(min-width:650px){.pitch{height:245px}.grid2{grid-template-columns:repeat(3,minmax(0,1fr))}.tabs{max-width:900px;margin:auto}.section{padding:14px}.hero{padding:15px}}
</style></head><body><main class="app"><header><div class="brand">FOOTBALL DAYS <small>BUILD YOUR CLUB · MAKE HISTORY</small></div><div class="stats"><div class="stat"><span>クラブ資金</span><b id="money">¥12,000,000</b></div><div class="stat"><span>ファン</span><b id="fans">1,200人</b></div><div class="stat"><span>チーム総合</span><b id="strength">62</b></div><div class="stat"><span>シーズン</span><b id="season">1年目</b></div></div></header><div class="hero"><div class="heroTop"><div><div class="clubname" id="clubname">みどりFC</div><div class="sub" id="clubsub">地域リーグ · 第1節まで準備期間</div></div><span class="badge" id="rank">リーグ 8位</span></div><div class="pitch"><canvas id="pitch"></canvas><div class="pitchLabel">HOME STADIUM · TRAINING GROUND</div></div></div><div id="content"></div><nav class="tabs"><button class="active" data-tab="home"><i>🏠</i>クラブ</button><button data-tab="team"><i>👥</i>選手・編成</button><button data-tab="training"><i>⚽</i>育成</button><button data-tab="league"><i>🏆</i>リーグ</button><button data-tab="facility"><i>🏟️</i>施設・経営</button></nav></main><div class="overlay" id="overlay"><div class="modal"><div class="modalHead"><h2 id="modalTitle">選手</h2><button class="btn" id="modalClose">閉じる ✕</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),content=$('content'),canvas=$('pitch'),ctx=canvas.getContext('2d');
const formations=['4-4-2','4-3-3','3-5-2'];
const names=['佐藤','鈴木','高橋','田中','伊藤','渡辺','山本','中村','小林','加藤','吉田','山田','松本','井上','木村','林','斎藤','清水','森','池田','橋本','阿部','石川','山崎','前田','藤田','岡田','後藤','長谷川','村上'];
const given=['蓮','湊','悠真','陽翔','樹','大翔','蒼','颯太','陸','結人','海斗','駿','拓海','一颯','健太','直樹','亮','翔','優斗','晴'];
const positions=['GK','DF','DF','DF','DF','MF','MF','MF','MF','FW','FW','GK','DF','DF','MF','MF','FW','FW'];
const posJP={GK:'GK',DF:'DF',MF:'MF',FW:'FW'};
const newPlayer=(i,base)=>({id:'p'+i,name:names[Math.floor(Math.random()*names.length)]+given[Math.floor(Math.random()*given.length)],pos:positions[i%positions.length],age:18+Math.floor(Math.random()*11),ov:base+Math.floor(Math.random()*13)-6,potential:Math.floor(Math.random()*18)+2,stamina:70+Math.floor(Math.random()*30),morale:60+Math.floor(Math.random()*35),value:Math.max(300000,base*130000+Math.floor(Math.random()*500000)),wage:Math.max(60000,base*8500+Math.floor(Math.random()*50000)),goals:0,assists:0,apps:0,trained:0});
function fresh(){let ps=Array.from({length:18},(_,i)=>newPlayer(i,58));return{club:'みどりFC',money:12000000,fans:1200,season:1,round:0,points:0,w:0,d:0,l:0,gf:0,ga:0,players:ps,formation:'4-4-2',facility:{training:1,stadium:1,academy:1,shop:0},sponsor:1,history:['クラブを設立した。夢のリーグ制覇へ！'],table:[],seasonLog:[],lastMatch:null,matchPlayed:false,scouted:[],achievements:[],trainingFocus:'balanced'}}
let s;try{let v=JSON.parse(localStorage.getItem('footballdays-save'));s=v&&Array.isArray(v.players)&&v.players.length?s:fresh()}catch(e){s=fresh()}
const leagues=['みどりFC','港町ユナイテッド','山の手SC','東都ブルーズ','さくらスポーツ','北風クラブ','リバーサイド','サンライズFC'];
let opponents=[];
function ensureLeague(){opponents=leagues.filter(n=>n!==s.club).map((name,i)=>({name,power:55+((i*7+13)%18),pts:0,w:0,d:0,l:0,gf:0,ga:0}));if(!s.table||!s.table.length)s.table=opponents.map(o=>({...o}));}
ensureLeague();
let tab='home',toastTimer=null;
function save(){try{localStorage.setItem('footballdays-save',JSON.stringify(s))}catch(e){}}
function notify(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2300)}
function fmt(n){return '¥'+Math.floor(n).toLocaleString('ja-JP')}
function teamPower(){let p=s.players.slice().sort((a,b)=>b.ov-a.ov).slice(0,11);return Math.round(p.reduce((a,x)=>a+x.ov,0)/Math.max(1,p.length)+s.facility.training*1.5)}
function population(){return Math.floor(s.fans)}
function drawPitch(){let r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));ctx.setTransform(d,0,0,d,0,0);let w=r.width,h=r.height;ctx.fillStyle='#347d4d';ctx.fillRect(0,0,w,h);for(let i=0;i<8;i++){ctx.fillStyle=i%2?'#398553':'#347d4d';ctx.fillRect(i*w/8,0,w/8,h)}ctx.strokeStyle='#d4e7cc';ctx.lineWidth=1.3;ctx.strokeRect(w*.07,h*.12,w*.86,h*.76);ctx.beginPath();ctx.moveTo(w/2,h*.12);ctx.lineTo(w/2,h*.88);ctx.stroke();ctx.beginPath();ctx.arc(w/2,h/2,h*.16,0,Math.PI*2);ctx.stroke();ctx.strokeRect(w*.07,h*.32,w*.14,h*.36);ctx.strokeRect(w*.79,h*.32,w*.14,h*.36);let formationsMap={'4-4-2':[[.15,.5],[.28,.25],[.28,.42],[.28,.58],[.28,.75],[.48,.23],[.46,.42],[.46,.58],[.48,.77],[.69,.4],[.69,.6]],'4-3-3':[[.15,.5],[.28,.25],[.28,.42],[.28,.58],[.28,.75],[.46,.3],[.46,.5],[.46,.7],[.68,.27],[.72,.5],[.68,.73]],'3-5-2':[[.15,.5],[.3,.3],[.3,.5],[.3,.7],[.46,.2],[.46,.35],[.47,.5],[.46,.65],[.46,.8],[.68,.4],[.68,.6]]};let spots=formationsMap[s.formation]||formationsMap['4-4-2'];spots.forEach((p,i)=>{ctx.fillStyle=i===0?'#e8c66f':'#f6f3df';ctx.beginPath();ctx.arc(w*p[0],h*p[1],5.4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#244632';ctx.stroke();ctx.fillStyle='#1b3b28';ctx.font='bold 7px sans-serif';ctx.textAlign='center';ctx.fillText(String(i+1),w*p[0],h*p[1]+2.5)});ctx.fillStyle='#ffffffc0';ctx.font='bold 10px sans-serif';ctx.textAlign='right';ctx.fillText(s.formation,w*.92,h*.08)}
function header(){let power=teamPower();$('money').textContent=fmt(s.money);$('fans').textContent=population().toLocaleString('ja-JP')+'人';$('strength').textContent=power;$('season').textContent=s.season+'年目';$('clubname').textContent=s.club;$('clubsub').textContent='地域リーグ · '+(s.round>=7?'シーズン終了':(s.round+1)+'節 / 全7節');let rank=1+(s.table||[]).filter(t=>t.pts>s.points).length;$('rank').textContent='リーグ '+rank+'位';drawPitch()}
function card(title,value,desc,action,label){return '<div class="card"><h3>'+title+'</h3><div class="big">'+value+'</div><div class="desc">'+desc+'</div>'+(action?'<button class="btn full '+(label==='実行する'||label==='試合開始'?'gold':'')+'" data-action="'+action+'">'+label+'</button>':'')+'</div>'}
function home(){let next=s.round>=7?'シーズン結果':s.lastMatch?'次の試合へ':'開幕戦の準備';let m=s.lastMatch?'<div class="card" style="margin-top:8px"><h3>直近の試合</h3><div class="big" style="font-size:19px">'+s.lastMatch.score+'</div><div class="desc">'+s.lastMatch.detail+'</div></div>':'<div class="card" style="margin-top:8px"><h3>クラブからのお知らせ</h3><div class="desc">練習で選手を育て、スカウトで戦力を補強。試合の収益で施設を強化し、地域の小さなクラブを名門へ育てよう。</div></div>';content.innerHTML='<div class="section"><div class="sectionTitle">クラブの現在地 <span class="muted">監督モード</span></div><div class="grid2">'+card('チーム総合力',teamPower(),'スタメン11人の能力と練習施設を反映')+card('勝ち点',s.points+' pt','勝利3・引き分け1・敗戦0')+card('戦績',s.w+'勝 '+s.d+'分 '+s.l+'敗','得点 '+s.gf+' / 失点 '+s.ga)+card('年間スポンサー',fmt(1500000*s.sponsor),'毎節の収入とは別にシーズン終了時に契約金')+'</div>'+m+'<div class="sectionTitle" style="margin-top:16px">今日のアクション</div><div class="grid2">'+card('⚽ 試合・リーグ',s.round>=7?'次シーズンへ':'第'+(s.round+1)+'節','試合を自動シミュレーション。結果で順位・ファン・資金が変化。','match',s.round>=7?'シーズンを進める':'試合開始')+card('🔎 選手スカウト','候補 3名','移籍金を払って選手を獲得。能力と将来性を見極めよう。','scout','スカウトへ')+'</div></div>'}
function team(){let ps=s.players.slice().sort((a,b)=>b.ov-a.ov);content.innerHTML='<div class="section"><div class="sectionTitle">選手・編成 <span class="muted">'+ps.length+'名所属</span></div><div class="note"></div><div class="card"><div class="row"><span>フォーメーション</span><div class="btnrow">'+formations.map(f=>'<button class="btn '+(s.formation===f?'green':'')+'" data-formation="'+f+'">'+f+'</button>').join('')+'</div></div><div class="desc">布陣を変えるとピッチ表示に反映。選手をタップすると契約・育成情報を確認できます。</div></div>'+ps.map((p,i)=>'<div class="player" data-player="'+p.id+'"><div class="shirt">'+p.pos+'</div><div><strong>'+p.name+'</strong><small>'+p.age+'歳 · '+(p.morale>=80?'絶好調':p.morale>=55?'普通':'疲れ気味')+' · 年俸 '+fmt(p.wage)+'</small><div class="bar"><span style="width:'+p.stamina+'%"></span></div></div><div class="rating">'+p.ov+'<small>OVR</small></div></div>').join('')+'</div>'}
function training(){let focus=s.trainingFocus;content.innerHTML='<div class="section"><div class="sectionTitle">トレーニングセンター <span class="muted">施設Lv.'+s.facility.training+'</span></div><div class="note">練習を実行すると選手の能力・コンディションが変化します。若手は伸びやすく、疲労がたまると伸びが落ちます。</div><div class="grid2">'+[['balanced','総合練習','全体をバランスよく強化'],['attack','攻撃練習','FW・MFの能力と得点力を強化'],['defense','守備練習','GK・DFの守備能力を強化'],['fitness','フィジカル','体力を回復し、全員の基礎能力を鍛える']].map(a=>'<button class="card" data-focus="'+a[0]+'" style="text-align:left;border-color:'+(focus===a[0]?'#e6c66f':'var(--line)')+'"><h3>'+a[1]+'</h3><div class="desc">'+a[2]+'</div><span class="pill">'+(focus===a[0]?'選択中':'練習メニュー')+'</span></button>').join('')+'</div><div style="margin-top:10px">'+card('練習を実行',fmt(180000),'コーチ・設備費。選手の成長と疲労に影響。','train','実行する')+card('練習設備の強化','Lv.'+s.facility.training,'費用 '+fmt(2500000*s.facility.training)+'。練習効果とチーム総合力が上昇。','upTraining','設備を強化')+'</div></div>'}
function league(){let arr=[{name:s.club,pts:s.points,w:s.w,d:s.d,l:s.l,gf:s.gf,ga:s.ga,power:teamPower(),self:true},...(s.table||[])].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga));content.innerHTML='<div class="section"><div class="sectionTitle">リーグ順位表 <span class="muted">全8クラブ</span></div><div class="note">勝利3ポイント、引き分け1ポイント。得失点差で順位を決定。全7節終了後、昇格をかけた次シーズンへ。</div><div class="row" style="font-weight:900;color:var(--muted)"><span>クラブ</span><span>試 勝 分 敗　点</span></div>'+arr.map((t,i)=>'<div class="row" style="background:'+(t.self?'#294533':'transparent')+'"><span><b style="color:'+(i===0?'var(--gold)':'inherit')+'">'+(i+1)+'. '+t.name+'</b><small>総合 '+(t.power||58)+' · 得失 '+((t.gf||0)-(t.ga||0))+'</small></span><span style="text-align:right;white-space:nowrap">'+(t.w||0)+' '+(t.d||0)+' '+(t.l||0)+'　<b>'+t.pts+'</b></span></div>').join('')+'<div class="sectionTitle" style="margin-top:18px">シーズン日程</div>'+Array.from({length:7},(_,i)=>'<div class="row"><span>第'+(i+1)+'節 <small>'+(i<s.round?(s.seasonLog[i]||'試合終了'):i===s.round?'次の試合':'予定')+'</small></span><span class="pill">'+(i<s.round?'終了':i===s.round?'NEXT':'未開催')+'</span></div>').join('')+'<button class="btn gold full" style="margin-top:12px" data-action="match">'+(s.round>=7?'次シーズンへ':'第'+(s.round+1)+'節 試合開始')+'</button></div>'}
function facilities(){let f=s.facility;content.innerHTML='<div class="section"><div class="sectionTitle">施設・クラブ経営 <span class="muted">収益と成長を両立</span></div><div class="grid2">'+[['training','練習場','選手育成の効果と総合力に影響',2500000],['stadium','スタジアム','観客収入とファン獲得が増える',3500000],['academy','育成アカデミー','若手の成長率とスカウト候補の質が上がる',3000000],['shop','クラブショップ','毎節のグッズ収益を生み出す',1800000]].map(a=>'<div class="card"><h3>'+a[1]+' <span class="pill">Lv.'+(f[a[0]]||0)+'</span></h3><div class="desc">'+a[2]+'</div><div class="money">'+fmt(a[3]*((f[a[0]]||0)+1))+'</div><button class="btn full" style="margin-top:9px" data-facility="'+a[0]+'">施設を強化</button></div>').join('')+'</div><div class="card" style="margin-top:9px"><h3>スポンサー契約</h3><div class="desc">シーズン終了時の契約金を増やす。契約レベル '+s.sponsor+'。</div><div class="btnrow"><span class="money">'+fmt(1000000*s.sponsor)+'</span><button class="btn" data-action="sponsor">契約を更新 · '+fmt(1000000*s.sponsor)+'</button></div></div><div class="card" style="margin-top:9px"><h3>経営のヒント</h3><div class="desc">勝利はファンと観客収入につながります。施設に投資しすぎず、選手獲得と運営費のバランスを取りましょう。</div></div></div>'}
function render(){header();if(tab==='home')home();if(tab==='team')team();if(tab==='training')training();if(tab==='league')league();if(tab==='facility')facilities();document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));save()}
function modal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('overlay').classList.add('show')}
function playerDetail(id){let p=s.players.find(x=>x.id===id);if(!p)return;modal(p.name,'<div class="grid2"><div class="card"><h3>総合能力</h3><div class="big">'+p.ov+'</div><div class="desc">ポジション '+p.pos+' · '+p.age+'歳</div></div><div class="card"><h3>将来性</h3><div class="big">+'+p.potential+'</div><div class="desc">成長余地の目安</div></div><div class="card"><h3>出場・得点</h3><div class="big">'+p.apps+' / '+p.goals+'</div><div class="desc">出場試合 / ゴール</div></div></div><div class="row"><span>コンディション</span><b>'+p.stamina+'%</b></div><div class="row"><span>モチベーション</span><b>'+p.morale+'%</b></div><div class="row"><span>移籍評価額</span><b>'+fmt(p.value)+'</b></div><div class="row"><span>年俸</span><b>'+fmt(p.wage)+'</b></div><div class="btnrow" style="margin-top:12px"><button class="btn gold" data-train-player="'+p.id+'">個別指導 · ¥80,000</button><button class="btn" data-sell="'+p.id+'">移籍させる</button></div>')}
function scout(){let candidates=Array.from({length:3},(_,i)=>({...newPlayer(100+s.season*10+s.round*3+i,52+Math.floor(Math.random()*17)),potential:8+Math.floor(Math.random()*22)}));s.scouted=candidates;modal('スカウト市場','<div class="note">移籍金は選手ごとに異なります。獲得した選手は即チームに加入します。アカデミーのレベルが高いほど有望選手が見つかりやすくなります。</div>'+candidates.map(p=>'<div class="player"><div class="shirt">'+p.pos+'</div><div><strong>'+p.name+' · '+p.age+'歳</strong><small>総合 '+p.ov+' · 将来性 +'+p.potential+' · 年俸 '+fmt(p.wage)+'</small></div><div><div class="money">'+fmt(p.value)+'</div><button class="btn" data-sign="'+p.id+'">獲得</button></div></div>').join('')+'<div class="desc" style="margin-top:10px">契約後は選手・編成タブから確認できます。</div>')}
function match(){if(s.round>=7){seasonEnd();return}let power=teamPower(),opp=s.table[s.round%s.table.length],oppPower=opp.power||60;let formBonus=s.formation==='4-3-3'?1:s.formation==='3-5-2'?0.5:0;let fatigue=s.players.slice().sort((a,b)=>b.ov-a.ov).slice(0,11).reduce((a,p)=>a+(p.stamina-70)*.035,0);let diff=(power+formBonus+fatigue)-oppPower;let myGoals=Math.max(0,Math.round(1.25+diff*.055+(Math.random()-.45)*2.3));let theirGoals=Math.max(0,Math.round(1.15-diff*.045+(Math.random()-.45)*2.3));let score=myGoals+' - '+theirGoals,result=myGoals>theirGoals?'勝利':myGoals===theirGoals?'引き分け':'敗戦';let earned=800000+myGoals*220000+s.facility.stadium*140000+s.fans*25;let expenses=s.players.reduce((a,p)=>a+p.wage,0)+350000;s.money+=earned-expenses+(result==='勝利'?400000:0);if(result==='勝利'){s.w++;s.points+=3;s.fans+=Math.floor(180+s.facility.stadium*45);opp.l++;opp.ga+=myGoals;opp.gf+=theirGoals}else if(result==='引き分け'){s.d++;s.points++;s.fans+=65;opp.d++;opp.ga+=myGoals;opp.gf+=theirGoals}else{s.l++;s.fans=Math.max(300,s.fans-20);opp.w++;opp.pts+=3;opp.ga+=myGoals;opp.gf+=theirGoals}if(result==='勝利'){opp.pts+=0; s.gf+=myGoals;s.ga+=theirGoals;opp.gf+=theirGoals;opp.ga+=myGoals}else{s.gf+=myGoals;s.ga+=theirGoals}opp.pts=opp.w*3+opp.d;let starters=s.players.slice().sort((a,b)=>b.ov-a.ov).slice(0,11);starters.forEach(p=>{p.apps++;p.stamina=Math.max(35,p.stamina-12-Math.floor(Math.random()*8));p.morale=Math.min(100,p.morale+(result==='勝利'?8:result==='引き分け'?2:-5));if(p.pos==='FW'&&Math.random()<myGoals/Math.max(1,starters.filter(x=>x.pos==='FW').length+1)){p.goals++;p.ov+=Math.random()<.18?1:0}});s.players.filter(p=>!starters.includes(p)).forEach(p=>p.stamina=Math.min(100,p.stamina+5));s.round++;s.seasonLog[s.round-1]='vs '+opp.name+' '+score+' ('+result+')';s.lastMatch={score:score+' '+result,detail:'対戦：'+opp.name+' · チーム力 '+power+' vs '+oppPower+' · 観客収入 '+fmt(earned)+' · 運営費 '+fmt(expenses),result,earned};s.history.unshift('第'+s.round+'節 '+result+' '+score+'。収支 '+fmt(earned-expenses));s.history=s.history.slice(0,20);render();modal('試合結果：'+result,'<div class="card" style="text-align:center;padding:20px"><div class="muted">'+s.club+' vs '+opp.name+'</div><div class="big" style="font-size:42px;margin:8px">'+score+'</div><span class="pill">'+result+'</span><div class="desc" style="margin-top:12px">'+s.lastMatch.detail+'</div></div><div class="grid2" style="margin-top:8px"><div class="card"><h3>勝ち点</h3><div class="big">+'+(result==='勝利'?3:result==='引き分け'?1:0)+'</div></div><div class="card"><h3>ファン</h3><div class="big">'+Math.floor(s.fans).toLocaleString('ja-JP')+'</div></div></div><button class="btn gold full" style="margin-top:12px" id="continue">続ける</button>');save()}
function seasonEnd(){let rank=1+(s.table||[]).filter(t=>t.pts>s.points).length;let prize=rank===1?8000000:rank<=3?4000000:1500000;s.money+=prize+1500000*s.sponsor;s.history.unshift(s.season+'年目終了：'+rank+'位。賞金 '+fmt(prize));modal('シーズン終了！','<div class="card"><div class="big">'+rank+'位</div><div class="desc">'+s.w+'勝 '+s.d+'分 '+s.l+'敗 · 勝ち点 '+s.points+'</div><div class="money">賞金 '+fmt(prize)+'</div></div><div class="desc" style="margin:12px 0">契約金と賞金を受け取りました。選手の疲労が回復し、新シーズンが始まります。</div><button class="btn gold full" id="newSeason">新シーズンを開始</button>');$('newSeason').onclick=()=>{s.season++;s.round=0;s.points=0;s.w=0;s.d=0;s.l=0;s.gf=0;s.ga=0;s.seasonLog=[];s.lastMatch=null;s.players.forEach(p=>{p.age++;p.stamina=100;p.morale=Math.min(100,p.morale+15);p.ov+=p.age<24?Math.random()<.45?1:0:0;p.value=Math.round(p.value*(p.age<28?1.05:.8))});s.table=(s.table||[]).map(t=>({...t,pts:0,w:0,d:0,l:0,gf:0,ga:0,power:Math.max(50,t.power+Math.floor(Math.random()*5)-2)}));s.money-=s.players.reduce((a,p)=>a+p.wage,0)*3;closeModal();render();notify('新シーズン開幕！')}}
function closeModal(){$('overlay').classList.remove('show');render()}
function train(){if(s.money<180000)return notify('資金が足りません');s.money-=180000;let gain=0;s.players.forEach(p=>{let ageBonus=p.age<23?1.8:p.age<27?1:0.45;let focus=s.trainingFocus==='attack'?(p.pos==='FW'||p.pos==='MF'?1.8:.45):s.trainingFocus==='defense'?(p.pos==='GK'||p.pos==='DF'?1.8:.45):s.trainingFocus==='fitness'?.6:1;let inc=Math.random()*1.5*ageBonus*focus*(.7+s.facility.training*.12);if(s.trainingFocus==='fitness')p.stamina=Math.min(100,p.stamina+18);else{p.ov=Math.min(99,p.ov+(inc>.85?1:0));p.stamina=Math.max(45,p.stamina-3);p.trained++}gain+=inc;p.morale=Math.min(100,p.morale+3)});s.history.unshift('全体練習を実施。選手の成長値 '+gain.toFixed(1));render();notify('練習完了！選手が成長しました')}
function upgrade(key){let costs={training:2500000*s.facility.training,stadium:3500000*(s.facility.stadium+1),academy:3000000*(s.facility.academy+1),shop:1800000*(s.facility.shop+1)};let cost=costs[key];if(s.money<cost)return notify('資金が足りません');s.money-=cost;s.facility[key]++;s.history.unshift(({training:'練習場',stadium:'スタジアム',academy:'アカデミー',shop:'クラブショップ'})[key]+'をLv.'+s.facility[key]+'に強化');render();notify('施設を強化しました！')}
function act(a){if(a==='match')match();if(a==='scout')scout();if(a==='train')train();if(a==='upTraining')upgrade('training');if(a==='sponsor'){let c=1000000*s.sponsor;if(s.money<c)return notify('資金が足りません');s.money-=c;s.sponsor++;render();notify('スポンサー契約を更新しました')}}
document.addEventListener('click',e=>{let b=e.target.closest('button,[data-player]');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.dataset.action)act(b.dataset.action);if(b.dataset.formation){s.formation=b.dataset.formation;render();notify('フォーメーションを変更しました')}if(b.dataset.focus){s.trainingFocus=b.dataset.focus;render()}if(b.dataset.facility)upgrade(b.dataset.facility);if(b.dataset.player)playerDetail(b.dataset.player);if(b.dataset.sign){let p=s.scouted.find(x=>x.id===b.dataset.sign);if(!p)return;if(s.money<p.value)return notify('移籍金が足りません');s.money-=p.value;s.players.push(p);s.scouted=s.scouted.filter(x=>x.id!==p.id);render();modal('契約成立！',p.name+'が'+s.club+'に加入しました。');}if(b.dataset.trainPlayer){let p=s.players.find(x=>x.id===b.dataset.trainPlayer);if(s.money<80000)return notify('資金が足りません');s.money-=80000;p.ov=Math.min(99,p.ov+1);p.morale=Math.min(100,p.morale+8);p.stamina=Math.max(45,p.stamina-4);playerDetail(p.id);render()}if(b.dataset.sell){let p=s.players.find(x=>x.id===b.dataset.sell);if(!p)return;if(s.players.length<=11)return notify('最低11人の選手が必要です');s.money+=Math.floor(p.value*.72);s.players=s.players.filter(x=>x.id!==p.id);render();modal('移籍成立',p.name+'が移籍しました。移籍金 '+fmt(Math.floor(p.value*.72))+'を獲得。')}if(b.id==='modalClose')closeModal();if(b.id==='continue')closeModal();if(b.id==='newSeason'){}});
$('modalClose').onclick=closeModal;$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal()});window.addEventListener('resize',drawPitch);render();
})();
</script></body></html>
