<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#14251d"><title>NEWTOWN｜街づくりと探索</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111f18;color:#f5f2e8;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;overflow:hidden}.app{height:100dvh;max-width:920px;margin:auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:#172920;border-bottom:1px solid #354c3b}.logo{font-size:15px;font-weight:950;letter-spacing:.12em}.logo small{display:block;color:#8ed8ae;font-size:9px;letter-spacing:.18em}.stats{display:flex;gap:5px}.stat{background:#26392c;border:1px solid #3a5542;border-radius:8px;padding:5px 7px;min-width:56px}.stat small{display:block;color:#b4c2b3;font-size:9px}.stat b{font-size:12px;color:#f3cf7b}.world{position:relative;flex:1;min-height:0;overflow:hidden;background:#9ebbb1}canvas{width:100%;height:100%;display:block;touch-action:none}.tip{position:absolute;top:9px;left:9px;max-width:72%;background:#13251de8;border:1px solid #ffffff30;border-radius:10px;padding:8px 10px;font-size:11px;line-height:1.5;pointer-events:none}.tip b{color:#f3cf7b}.tools{position:absolute;right:9px;top:9px;display:grid;gap:5px}.tools button{width:38px;height:38px;border-radius:10px;background:#162b21e8;color:white;border:1px solid #ffffff55;font-size:19px}.toast{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#14281e;border:1px solid #789879;border-radius:11px;padding:10px 13px;font-size:12px;max-width:90%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}.bottom{background:#15251c;border-top:1px solid #344a3a;padding:8px 10px calc(7px + env(safe-area-inset-bottom));display:grid;gap:7px}.selected{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:29px}.selected strong{font-size:13px}.selected span{font-size:10px;color:#b1c0b1}.actions{display:flex;gap:6px;overflow:auto;scrollbar-width:none}.btn{flex-shrink:0;border:1px solid #425b47;background:#263c2d;color:#f6f2e7;border-radius:9px;padding:9px 11px;min-height:39px;font-size:12px;font-weight:800}.primary{background:#e2bd6d;color:#1c2a1f;border-color:#f0d28d}.btn:disabled{opacity:.35}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.nav button{border:0;border-radius:8px;background:transparent;color:#9eaf9f;font-size:10px;padding:5px 1px}.nav button.active{background:#2a4231;color:#9be1b4}.nav i{display:block;font-size:16px;font-style:normal;margin-bottom:2px}.sheet{position:absolute;inset:0;background:#06130dcc;display:none;align-items:flex-end;z-index:4}.sheet.show{display:flex}.panel{width:100%;max-height:78%;overflow:auto;background:#17281e;border:1px solid #405a44;border-radius:18px 18px 0 0;padding:15px 12px calc(15px + env(safe-area-inset-bottom))}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.panel h2{font-size:17px;margin:0}.close{background:#304735;border:0;color:white;padding:8px 11px;border-radius:8px}.note{font-size:11px;line-height:1.6;background:#24392b;color:#c4d2c3;padding:10px;border-radius:10px;margin-bottom:10px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{background:#24392b;color:#f5f0e4;text-align:left;border:1px solid #3d5842;border-radius:12px;padding:11px}.card b{display:block;font-size:13px;margin:5px 0}.card p{font-size:10px;line-height:1.5;color:#b7c7b8;margin:0 0 8px}.cost{font-size:12px;color:#f3cf7b;font-weight:900}.row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #344b39;font-size:12px}.row b{color:#f3cf7b}@media(min-width:650px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-height:650px){header{padding:5px 9px}.bottom{gap:4px;padding-top:5px}.btn{min-height:32px;padding:6px 9px}}
</style></head><body><main class="app">
<header><div class="logo">NEWTOWN<small>BUILD · EXPLORE · GROW</small></div><div class="stats"><div class="stat"><small>所持金</small><b id="money">¥12,000</b></div><div class="stat"><small>毎日収支</small><b id="income">+¥0</b></div><div class="stat"><small>人口</small><b id="pop">0人</b></div><div class="stat"><small>日数</small><b id="day">1日目</b></div></div></header>
<section class="world"><canvas id="map"></canvas><div class="tip" id="tip"><b>新しい街へようこそ！</b><br>空き地をタップして選択。建築で街を広げ、収入を得て探索しよう。ドラッグで視点移動、ピンチでズーム。</div><div class="tools"><button id="plus">＋</button><button id="minus">−</button><button id="home">⌖</button></div><div class="toast" id="toast"></div><div class="sheet" id="sheet"><div class="panel"><div class="panelhead"><h2 id="panelTitle">建築</h2><button class="close" id="close">閉じる ✕</button></div><div id="panelBody"></div></div></div></section>
<footer class="bottom"><div class="selected"><div><strong id="selTitle">土地を選択してください</strong><br><span id="selSub">空き地を選ぶと建築できます</span></div><span id="mode">探索モード</span></div><div class="actions"><button class="btn primary" id="build">🏗️ 建てる</button><button class="btn" id="remove">🧹 撤去</button><button class="btn" id="next">🌤️ 1日進める</button><button class="btn" id="save">💾 保存</button></div><nav class="nav"><button class="active" data-tab="city"><i>🏙️</i>街</button><button data-tab="build"><i>🏗️</i>建築</button><button data-tab="explore"><i>🧭</i>探索</button><button data-tab="records"><i>📊</i>記録</button></nav></footer></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),c=$('map'),g=c.getContext('2d'),N=18;
const types={road:{n:'道路',cost:100,inc:0,pop:0,color:'#818984',icon:'🛣️',desc:'街の動線をつなぐ。'},house:{n:'住宅',cost:1200,inc:90,pop:8,color:'#e6cfa2',icon:'🏠',desc:'住民が増え、毎日税収が入る。'},shop:{n:'商店',cost:2400,inc:260,pop:2,color:'#d78d6e',icon:'🏪',desc:'収益性の高い小さなお店。'},park:{n:'公園',cost:1600,inc:-30,pop:0,color:'#559568',icon:'🌳',desc:'街の魅力を高める憩いの場所。'},cafe:{n:'カフェ',cost:3200,inc:380,pop:1,color:'#b98b64',icon:'☕',desc:'人気のカフェ。街に彩りを加える。'},tower:{n:'マンション',cost:6500,inc:520,pop:32,color:'#9bbbc5',icon:'🏢',desc:'人口を大きく増やす中層マンション。'},farm:{n:'農園',cost:900,inc:120,pop:1,color:'#a0be73',icon:'🌾',desc:'安価に収入を生む小さな農園。'},landmark:{n:'展望タワー',cost:9500,inc:700,pop:0,color:'#e4bd64',icon:'🗼',desc:'街のシンボル。観光客を呼び込む。'}};
const fresh=()=>({money:12000,day:1,tiles:Array.from({length:N*N},(_,i)=>({x:i%N,z:Math.floor(i/N),type:(i%N===8||Math.floor(i/N)===8)?'road':null})),discoveries:0,totalEarned:0,history:[],milestones:[]});
let s;try{let q=JSON.parse(localStorage.getItem('newtown-save'));s=q&&q.tiles&&q.tiles.length===N*N?q:fresh()}catch(e){s=fresh()}
let sel={x:7,z:7},cam={x:0,y:0,z:1},drag=null,timer;
const tile=(x,z)=>s.tiles[z*N+x],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);g.setTransform(d,0,0,d,0,0);draw()}
function iso(x,z,h=0){let w=c.clientWidth,hh=c.clientHeight,unit=Math.min(w,hh)*.73/(N*1.25)*cam.z;return{x:w/2+(x-z)*unit*1.0+cam.x,y:hh*.50+(x+z)*unit*.5-h*unit+cam.y,u:unit}}
function poly(a,fill,stroke){g.beginPath();a.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath();g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=1;g.stroke()}}
function shade(hex,n){let x=parseInt(hex.slice(1),16),r=clamp((x>>16)+n,0,255),b=clamp((x&255)+n,0,255),gg=clamp(((x>>8)&255)+n,0,255);return'#'+((1<<24)|(r<<16)|(gg<<8)|b).toString(16).slice(1)}
function drawTile(x,z){let p=iso(x,z),u=p.u,t=tile(x,z),rx=u,rz=u*.5;poly([{x:p.x,y:p.y},{x:p.x+rx,y:p.y+rz},{x:p.x,y:p.y+rz*2},{x:p.x-rx,y:p.y+rz}],(x+z)%2?'#91ad83':'#9fba90','#7c9a7b');
if(t.type){let a=types[t.type];if(t.type==='road'){poly([{x:p.x,y:p.y},{x:p.x+rx*.9,y:p.y+rz},{x:p.x,y:p.y+rz*2},{x:p.x-rx*.9,y:p.y+rz}],'#737d78','#a6afa3');g.strokeStyle='#e8dbab';g.setLineDash([3*u,3*u]);g.beginPath();g.moveTo(p.x-rx*.35,p.y+rz);g.lineTo(p.x+rx*.35,p.y+rz);g.stroke();g.setLineDash([])}
else if(t.type==='park'||t.type==='farm'){poly([{x:p.x,y:p.y-2*u},{x:p.x+rx*.8,y:p.y+rz},{x:p.x,y:p.y+rz*2-2*u},{x:p.x-rx*.8,y:p.y+rz}],a.color,'#d4dbb5');if(t.type==='park'){g.fillStyle='#3c754b';g.beginPath();g.arc(p.x,p.y-8*u,7*u,0,7);g.fill();g.fillStyle='#81b878';g.beginPath();g.arc(p.x-2*u,p.y-10*u,5*u,0,7);g.fill()}else{for(let i=0;i<3;i++){g.strokeStyle='#e0d89a';g.lineWidth=1.5*u;g.beginPath();g.moveTo(p.x-rx*.4+i*rx*.3,p.y+rz*.55);g.lineTo(p.x-rx*.25+i*rx*.3,p.y+rz*1.4);g.stroke()}}}
else{let h=(t.type==='tower'?37:t.type==='landmark'?48:t.type==='shop'?19:t.type==='cafe'?16:14)*u,hw=rx*.62,dep=rz*.62;poly([{x:p.x-hw,y:p.y+dep-h},{x:p.x,y:p.y+dep*2-h},{x:p.x,y:p.y+dep*2},{x:p.x-hw,y:p.y+dep}],shade(a.color,-35),'#687668');poly([{x:p.x,y:p.y+dep*2-h},{x:p.x+hw,y:p.y+dep-h},{x:p.x+hw,y:p.y+dep},{x:p.x,y:p.y+dep*2}],shade(a.color,-18),'#687668');poly([{x:p.x,y:p.y-h},{x:p.x+hw,y:p.y+dep-h},{x:p.x,y:p.y+dep*2-h},{x:p.x-hw,y:p.y+dep-h}],shade(a.color,15),'#f2e3c1');if(t.type==='tower'){for(let i=0;i<3;i++){g.strokeStyle='#547e87';g.lineWidth=1.4*u;g.beginPath();g.moveTo(p.x-hw*.7,p.y+dep-h+(8+i*7)*u);g.lineTo(p.x-hw*.12,p.y+dep*1.8-h+(8+i*7)*u);g.stroke()}}if(t.type==='landmark'){g.strokeStyle='#f7e0a0';g.lineWidth=2*u;g.beginPath();g.moveTo(p.x,p.y-h);g.lineTo(p.x,p.y-h-15*u);g.stroke();g.fillStyle='#f7d57f';g.beginPath();g.arc(p.x,p.y-h-16*u,3*u,0,7);g.fill()}}}
if(sel.x===x&&sel.z===z)poly([{x:p.x,y:p.y-1},{x:p.x+rx,y:p.y+rz},{x:p.x,y:p.y+rz*2},{x:p.x-rx,y:p.y+rz}], '#ffdb8a28','#ffdc85')}
function draw(){if(!c.clientWidth)return;let w=c.clientWidth,h=c.clientHeight,bg=g.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#98b8b5');bg.addColorStop(.55,'#c4d0ae');bg.addColorStop(1,'#839f7c');g.fillStyle=bg;g.fillRect(0,0,w,h);g.fillStyle='#f2e4b7';g.globalAlpha=.4;g.beginPath();g.arc(w*.8,h*.16,23,0,7);g.fill();g.globalAlpha=1;for(let sum=0;sum<2*N-1;sum++)for(let x=0;x<N;x++){let z=sum-x;if(z>=0&&z<N)drawTile(x,z)}}
function sums(){let b=s.tiles.filter(t=>t.type&&t.type!=='road'),pop=b.reduce((a,t)=>a+types[t.type].pop,0),inc=b.reduce((a,t)=>a+types[t.type].inc,0);$('money').textContent='¥'+Math.floor(s.money).toLocaleString('ja-JP');$('income').textContent=(inc>=0?'+':'−')+'¥'+Math.abs(inc).toLocaleString('ja-JP');$('income').style.color=inc>=0?'#f3cf7b':'#ff9c89';$('pop').textContent=pop+'人';$('day').textContent=s.day+'日目';$('selTitle').textContent=tile(sel.x,sel.z).type?types[tile(sel.x,sel.z).type].n:'空き地';$('selSub').textContent='区画 '+sel.x+', '+sel.z+' · '+(tile(sel.x,sel.z).type?'建物を選択中':'建築できます');$('mode').textContent='探索モード';$('remove').disabled=!tile(sel.x,sel.z).type;$('build').textContent=tile(sel.x,sel.z).type?'🏗️ 建て替え':'🏗️ 建てる';draw()}
function note(msg){let el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>el.classList.remove('show'),2300)}
function save(silent=false){try{localStorage.setItem('newtown-save',JSON.stringify(s));if(!silent)note('街のデータを保存しました')}catch(e){note('保存できませんでした')}}
function sheet(title,html){$('panelTitle').textContent=title;$('panelBody').innerHTML=html;$('sheet').classList.add('show')}
function close(){ $('sheet').classList.remove('show');sums()}
function check(){let count=s.tiles.filter(t=>t.type&&t.type!=='road').length,pop=s.tiles.reduce((a,t)=>a+(t.type?types[t.type].pop:0),0),qs=[['first',count>=1,'最初の建物を建てる',500],['five',count>=5,'建物を5軒建てる',1500],['pop',pop>=30,'人口30人を達成',2500],['tower',s.tiles.some(t=>t.type==='landmark'),'街のシンボルを建設',3000]];qs.forEach(q=>{if(q[1]&&!s.milestones.includes(q[0])){s.milestones.push(q[0]);s.money+=q[3];note('目標達成：'+q[2]+'！ +¥'+q[3]);save(true)}});sums()}
function buildPanel(){sheet('何を建てますか？','<div class="note">選択中：区画 '+sel.x+', '+sel.z+'。建物は毎日収支に反映されます。道路沿いに街を広げよう。</div><div class="cards">'+Object.entries(types).map(([k,t])=>'<button class="card" data-type="'+k+'" '+(s.money<t.cost?'disabled':'')+'><span style="font-size:22px">'+t.icon+'</span><b>'+t.n+'</b><p>'+t.desc+'</p><div class="cost">¥'+t.cost.toLocaleString('ja-JP')+' · '+(t.inc>=0?'+':'')+t.inc+'/日</div><p>人口 +'+t.pop+'</p></button>').join('')+'</div>');$('panelBody').querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>place(b.dataset.type))}
function place(k){let t=tile(sel.x,sel.z),d=types[k];if(s.money<d.cost)return note('資金が足りません');if(t.type)return note('この区画は使用中です。先に撤去してください');s.money-=d.cost;t.type=k;s.history.unshift(s.day+'日目：'+d.n+'を建設');save(true);close();sums();note(d.n+'を建設しました！');check()}
function remove(){let t=tile(sel.x,sel.z);if(!t.type)return note('ここには建物がありません');let d=types[t.type],refund=Math.floor(d.cost*.25);s.money+=refund;s.history.unshift(s.day+'日目：'+d.n+'を撤去');t.type=null;save(true);sums();note('撤去しました。¥'+refund+'を回収')}
function nextDay(){let inc=s.tiles.reduce((a,t)=>a+(t.type?types[t.type].inc:0),0);s.money+=inc;s.totalEarned+=Math.max(0,inc);s.day++;if(s.day%3===0)s.discoveries++;s.history.unshift(s.day+'日目：収支 '+(inc>=0?'+':'')+'¥'+inc);s.history=s.history.slice(0,30);save(true);sums();check();note(s.day+'日目になりました。収支 '+(inc>=0?'+':'')+'¥'+inc)}
function records(){let b=s.tiles.filter(t=>t.type&&t.type!=='road').length,p=s.tiles.reduce((a,t)=>a+(t.type?types[t.type].pop:0),0),qs=[['first','最初の建物を建てる',500],['five','建物を5軒建てる',1500],['pop','人口30人を達成',2500],['tower','街のシンボルを建設',3000]];sheet('街の記録','<div class="cards"><div class="card">🏘️<b>建物</b><div class="cost">'+b+'軒</div></div><div class="card">👥<b>人口</b><div class="cost">'+p+'人</div></div><div class="card">💰<b>累計収益</b><div class="cost">¥'+s.totalEarned.toLocaleString('ja-JP')+'</div></div><div class="card">🧭<b>探索日数</b><div class="cost">'+s.discoveries+'日</div></div></div><h3 style="font-size:13px">街の目標</h3>'+qs.map(q=>'<div class="row"><span>'+(s.milestones.includes(q[0])?'✅ ':'🔒 ')+q[1]+'</span><b>'+(s.milestones.includes(q[0])?'達成':'¥'+q[2])+'</b></div>').join('')+'<h3 style="font-size:13px;margin-top:18px">最近の出来事</h3>'+s.history.slice(0,8).map(h=>'<div class="row">'+h+'</div>').join('')+'<button class="btn" id="reset" style="margin-top:15px">新しい街を始める</button>');$('reset').onclick=()=>{if(confirm('今の街を消して新しい街を始めますか？')){s=fresh();sel={x:7,z:7};save(true);close();sums();note('新しい街を始めました')}}}
function explore(){let empty=s.tiles.filter(t=>!t.type).length;sheet('街を探索','<div class="note">ドラッグで視点を動かし、＋／−またはピンチでズーム。空き地をタップして建築場所を選べます。好きな区画から少しずつ街を発展させよう。</div><div class="row"><span>未開発の土地</span><b>'+empty+'区画</b></div><div class="row"><span>発展した日数</span><b>'+s.day+'日</b></div><div class="row"><span>発見記録</span><b>'+s.discoveries+'回</b></div><button class="btn primary" id="backCenter" style="width:100%;margin-top:12px">街の中心へ戻る</button>');$('backCenter').onclick=()=>{cam={x:0,y:0,z:1};close();draw()}}
function tab(name){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));if(name==='city'){close();$('tip').innerHTML='<b>街づくりを楽しもう！</b><br>空き地をタップして選択。ドラッグで視点移動、ピンチでズーム。'}if(name==='build')buildPanel();if(name==='explore')explore();if(name==='records')records()}
function hit(p){let best=null,dist=99;for(let z=0;z<N;z++)for(let x=0;x<N;x++){let q=iso(x,z),dx=Math.abs(p.x-q.x),dy=Math.abs(p.y-q.y),d=dx/(q.u||1)+dy/(q.u*.5||1);if(dx<q.u&&dy<q.u*.8&&d<dist){best={x,z};dist=d}}return best}
function pos(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false}});
c.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>7)drag.moved=true;if(drag.moved){cam.x=drag.cx+dx;cam.y=drag.cy+dy;draw()}});
c.addEventListener('pointerup',e=>{if(!drag)return;let moved=drag.moved;drag=null;if(!moved){let h=hit(pos(e));if(h){sel=h;sums();let t=tile(h.x,h.z);if(t.type)note(types[t.type].n+'：'+types[t.type].desc)}}});
let pinch=0;c.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});c.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)cam.z=clamp(cam.z*d/pinch,.55,1.7);pinch=d;draw()}},{passive:false});c.addEventListener('touchend',()=>pinch=0);
